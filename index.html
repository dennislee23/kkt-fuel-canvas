<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { min-width: 0; }
html, body {
  min-height: 100%;
  background: #FFFFFF;
  color: #1D1D1F;
  font-family: 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { min-height: 100vh; }
button { cursor: pointer; font-family: inherit; }
ol, ul { list-style-position: outside; }

::-webkit-scrollbar { width: 5px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(30,24,16,0.14); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(30,24,16,0.24); }

@keyframes fadeUp  { from { transform: translateY(6px); opacity:.94; } to { transform: translateY(0); opacity:1; } }
@keyframes slideIn { from { transform: translateX(18px); } to { transform: translateX(0); } }
.fade-up  { animation: fadeUp  .30s cubic-bezier(.2,.7,.3,1) both; }
.slide-in { animation: slideIn .26s cubic-bezier(.2,.7,.3,1) both; }
@media (prefers-reduced-motion: reduce) { .fade-up, .slide-in { animation: none; } }

.tile { transition: box-shadow .18s ease, transform .16s ease, border-color .16s ease; }
.tile:hover {
  box-shadow: 0 8px 28px rgba(30,24,16,0.12), 0 2px 6px rgba(30,24,16,0.06) !important;
  border-color: rgba(30,24,16,0.18) !important;
  transform: translateY(-2px);
}
.prob-btn { appearance: none; -webkit-appearance: none; }
.prob-btn:focus-visible { outline: 2px solid #FF6A00; outline-offset: 2px; }
@media print {
  html, body { min-width: 0 !important; overflow-x: hidden !important; }
  @page { size: A4 landscape; margin: 1cm; }
  #catalog-main { display: none !important; }
  .hero-section { min-height: 0 !important; overflow: visible !important; page-break-inside: avoid; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="kktechnologies-profile-data.js?v=6"></script>
<script src="existing/roadmap-data.js?v=3"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const getRuData = () => ({
  BLOCKS:         window.FUEL_BLOCKS,
  SUBBLOCKS:      window.FUEL_SUBBLOCKS || [],
  PROBLEMS:       window.FUEL_PROBLEMS,
  STAGES:         window.FUEL_STAGES,
  CARDS:          window.FUEL_CARDS,
  DRAWER_CONTENT: window.FUEL_DRAWER_CONTENT || {},
});
const getEnData = () => ({
  BLOCKS:         window.FUEL_BLOCKS_EN || window.FUEL_BLOCKS,
  SUBBLOCKS:      window.FUEL_SUBBLOCKS_EN || window.FUEL_SUBBLOCKS || [],
  PROBLEMS:       window.FUEL_PROBLEMS_EN || window.FUEL_PROBLEMS,
  STAGES:         window.FUEL_STAGES_EN  || window.FUEL_STAGES,
  CARDS:          window.FUEL_CARDS_EN   || window.FUEL_CARDS,
  DRAWER_CONTENT: window.FUEL_DRAWER_CONTENT_EN || window.FUEL_DRAWER_CONTENT || {},
});
const getData = (lang) => {
  const base = lang === 'EN' ? getEnData() : getRuData();
  return {
    ...base,
    BLOCK_BY_ID:    Object.fromEntries(base.BLOCKS.map(b   => [b.id, b])),
    PROBLEM_BY_ID:  Object.fromEntries(base.PROBLEMS.map(p => [p.id, p])),
    CARD_BY_ID:     Object.fromEntries(base.CARDS.map(c   => [c.id, c])),
    STAGE_BY_ID:    Object.fromEntries(base.STAGES.map(s  => [s.id, s])),
    SUBBLOCK_BY_ID: Object.fromEntries(base.SUBBLOCKS.map(s=> [s.id, s])),
  };
};
const DataCtx = React.createContext(null);

// Static fallback for non-reactive lookups outside App
const BLOCKS         = window.FUEL_BLOCKS;
const SUBBLOCKS      = window.FUEL_SUBBLOCKS || [];
const PROBLEMS       = window.FUEL_PROBLEMS;
const STAGES         = window.FUEL_STAGES;
const CARDS          = window.FUEL_CARDS;
const DRAWER_CONTENT = window.FUEL_DRAWER_CONTENT || {};

const BLOCK_BY_ID    = Object.fromEntries(BLOCKS.map(b  => [b.id,  b]));
const PROBLEM_BY_ID  = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
const CARD_BY_ID     = Object.fromEntries(CARDS.map(c   => [c.id,  c]));
const STAGE_BY_ID    = Object.fromEntries(STAGES.map(s  => [s.id,  s]));
const SUBBLOCK_BY_ID = Object.fromEntries(SUBBLOCKS.map(s => [s.id, s]));

/* ── Palette ── */
const C = {
  bg:         '#FFFFFF',
  surface:    '#FFFFFF',
  surfaceHov: '#F5F5F7',
  rail:       '#1D1D1F',
  border:     'rgba(0,0,0,0.11)',
  borderMid:  'rgba(0,0,0,0.16)',
  borderHov:  'rgba(0,0,0,0.28)',
  text:       '#1D1D1F',
  textSec:    '#515257',
  textMuted:  '#86868B',
  accent:     '#FF6A00',
  accentDim:  'rgba(255,106,0,0.10)',
  accentText: '#C2410C',
};

const HEADER_H    = 60;
const STAGE_BAR_H = 124;
const RAIL_W      = 236;
const TASKS_COL   = '272px';
const GRID_COLS   = `${TASKS_COL} repeat(3, minmax(220px, 1fr))`;
const PROB_H      = 148;

// Main-site palette: single orange accent + neutrals only (no green/blue/maroon/purple).
const STAGE_P = {
  1: { accent:'#FF6A00', dim:'rgba(255,106,0,0.10)', line:'rgba(0,0,0,0.12)' },
  2: { accent:'#FF6A00', dim:'rgba(255,106,0,0.10)', line:'rgba(0,0,0,0.12)' },
  3: { accent:'#FF6A00', dim:'rgba(255,106,0,0.10)', line:'rgba(0,0,0,0.12)' },
};

const NEUTRAL_TAG = { fg:'#515257', bg:'rgba(0,0,0,0.05)' };
const IMPACT_P = {
  'Рост выручки':                 NEUTRAL_TAG,
  'Сокращение затрат':            NEUTRAL_TAG,
  'Скорость и качество решений':  NEUTRAL_TAG,
  'Повышение производительности': NEUTRAL_TAG,
};
const SCALE_P = {
  'Quick Win':      NEUTRAL_TAG,
  'Быстрый эффект': NEUTRAL_TAG,
  'Scoped Project': NEUTRAL_TAG,
  'Проектный запуск':NEUTRAL_TAG,
  'Major Program':  NEUTRAL_TAG,
  'Системная программа':NEUTRAL_TAG,
};
const COST_P = NEUTRAL_TAG;

/* ── ATOMS ── */
const Pill = ({ label, fg, bg, size='sm' }) => (
  <span style={{
    display:'inline-flex', alignItems:'center',
    padding: size==='sm' ? '2px 6px' : '4px 12px',
    borderRadius:'100px', background:bg, color:fg,
    fontSize: size==='sm' ? '8.5px' : '11.5px',
    fontWeight:600, letterSpacing:'.01em',
    whiteSpace:'nowrap', lineHeight:1.5, flexShrink:0,
  }}>{label}</span>
);

const Wordmark = ({ lang }) => (
  <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1775.724 2112.369" width="26" height="26" aria-hidden="true" style={{ display:'block', color:C.text }}>
      <g transform="translate(-388.609 2234.533) scale(0.1 -0.1)" fill="currentColor">
        <path d="M6551 22338 c-492 -47 -915 -423 -1022 -911 -38 -175 -38 -182 99 -1944 l128 -1651 -69 -84 c-127 -154 -324 -422 -449 -608 -778 -1164 -1222 -2449 -1334 -3860 -21 -264 -24 -855 -6 -1075 100 -1188 454 -2223 1091 -3185 463 -701 1102 -1348 1796 -1821 817 -557 1769 -933 2725 -1078 948 -143 1812 -88 2649 169 485 149 1015 402 1430 682 58 40 142 95 186 125 156 103 186 125 312 231 152 126 446 412 582 567 497 561 865 1198 1101 1905 138 411 223 813 272 1280 20 195 17 826 -5 1012 -130 1080 -586 2028 -1342 2783 -799 799 -1829 1270 -2965 1355 -175 13 -330 13 -330 0 0 -5 -24 -10 -54 -10 -132 0 -337 -56 -475 -131 -469 -253 -702 -800 -555 -1306 117 -406 448 -712 860 -798 44 -9 167 -20 274 -25 229 -10 366 -29 546 -75 611 -157 1136 -549 1464 -1095 162 -269 276 -599 320 -925 49 -367 -2 -868 -130 -1270 -119 -371 -330 -764 -576 -1069 -49 -61 -148 -171 -221 -245 -73 -75 -133 -139 -133 -143 0 -10 -117 -108 -129 -108 -7 0 -47 -26 -89 -59 -467 -355 -1024 -578 -1617 -646 -165 -19 -539 -22 -726 -5 -1215 109 -2298 687 -3054 1630 -653 816 -998 1852 -960 2885 31 869 219 1635 585 2380 862 1758 2571 2969 4500 3190 434 49 940 49 1440 -1 1007 -100 2022 -424 2913 -931 1026 -582 1912 -1410 2561 -2393 702 -1062 1107 -2240 1218 -3540 17 -205 18 -954 0 -1150 -110 -1253 -471 -2345 -1117 -3381 -1125 -1803 -2991 -3059 -5070 -3413 -365 -62 -672 -92 -1085 -106 -301 -10 -409 -22 -533 -60 -292 -90 -542 -305 -677 -584 -121 -250 -148 -517 -79 -783 118 -449 501 -779 970 -834 167 -19 668 0 1084 41 1948 195 3791 971 5295 2229 318 266 743 677 996 961 1078 1214 1810 2583 2199 4115 394 1549 398 3186 10 4746 -297 1194 -843 2365 -1563 3350 l-99 137 163 2123 c90 1168 163 2180 164 2249 0 69 -5 153 -10 187 -84 519 -515 919 -1047 973 -190 20 -395 -16 -589 -103 -55 -24 -949 -453 -1989 -952 -1039 -499 -1899 -909 -1911 -912 -11 -3 -113 18 -225 46 -781 192 -1522 283 -2319 284 -449 0 -738 -20 -1165 -79 l-190 -27 -1225 588 c-674 323 -1445 693 -1715 823 -269 129 -531 250 -581 268 -157 56 -331 78 -503 62z" />
      </g>
    </svg>
    <span style={{ fontFamily:'DM Sans, system-ui, sans-serif', fontSize:'13px', fontWeight:600, letterSpacing:'.18em', textTransform:'uppercase', color:C.text, lineHeight:1 }}>KKT</span>
  </div>
);

const splitSpine = (text) => {
  if (!text) return [text];
  const parts = text.split(/(?<=\.)\s+/);
  if (parts.length <= 2) return [text];
  const mid = Math.ceil(parts.length / 2);
  return [parts.slice(0, mid).join(' '), parts.slice(mid).join(' ')].filter(Boolean);
};

/* ── TAG ROW ── */
const TagRow = ({ card }) => {
  const imp = IMPACT_P[card.impact] || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const scl = SCALE_P[card.scale]   || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  return (
    <div style={{ display:'flex', flexWrap:'nowrap', gap:'4px', alignItems:'center', overflow:'hidden' }}>
      <Pill label={card.scale}  fg={scl.fg} bg={scl.bg} />
      <Pill label={card.cost}   fg={COST_P.fg} bg={COST_P.bg} />
      <Pill label={card.impact} fg={imp.fg}  bg={imp.bg} />
    </div>
  );
};

/* ── CARD TILE ── */
const CardTile = ({ card, onClick }) => {
  const dct = React.useContext(DataCtx);
  const sp = STAGE_P[card.stage];
  return (
    <div className="tile" onClick={onClick} data-card-id={card.id}
      style={{
        position:'relative', padding:'16px 17px 15px',
        background:C.surface,
        border:`1px solid ${C.border}`,
        borderTop:`2px solid ${sp.line}`,
        borderRadius:'8px', cursor:'pointer',
        display:'flex', flexDirection:'column', gap:'10px',
      }}
    >
      <h4 style={{
        fontFamily:'DM Sans, system-ui, sans-serif',
        fontSize:'14.5px', fontWeight:500, color:C.text,
        lineHeight:1.30, letterSpacing:'-.008em',
        textWrap:'pretty', paddingRight:'18px',
      }}>{card.title}</h4>

      <p style={{
        fontSize:'11.5px', color:'#86868B',
        lineHeight:1.65, fontWeight:400,
        fontStyle:'italic', textWrap:'pretty', flex:1,
      }}>{card.shortDescription}</p>

      <div style={{ marginTop:'auto' }}>
        <div style={{ paddingTop:'9px', borderTop:`1px solid ${C.border}` }}>
          <TagRow card={card} />
        </div>
        {card.lock && (
          <div style={{ display:'flex', gap:'5px', alignItems:'flex-start', marginTop:'8px' }}>
            <span style={{ fontSize:'10px', color:C.textMuted, lineHeight:1.55, flexShrink:0 }}>🔒</span>
            <span style={{ fontSize:'10.5px', color:C.textMuted, lineHeight:1.55, fontWeight:400, textWrap:'pretty' }}>{card.lock}</span>
          </div>
        )}
        {card.crossRef && !card.lock && (
          <div style={{ marginTop:'7px' }}>
            <span style={{ fontSize:'10.5px', color:C.textMuted, fontWeight:400 }}>{dct?.lang==='EN' ? '→ see domain: ' : '→ см. дом: '}{card.crossRef.targetLabel}</span>
          </div>
        )}
      </div>
      <span style={{ position:'absolute', top:'14px', right:'13px', color:`${C.borderMid}`, fontSize:'16px', lineHeight:1 }}>›</span>
    </div>
  );
};

/* ── STAGE HEADER ── */
const StageHeader = ({ stage }) => {
  const sp = STAGE_P[stage.id];
  return (
    <div style={{
      position:'relative', height:'100%',
      padding:'20px 22px 24px',
      background:`linear-gradient(155deg, ${sp.dim} 0%, ${C.surface} 70%)`,
      display:'flex', flexDirection:'column', gap:'6px',
    }}>
      <h3 style={{
        fontFamily:'DM Sans, system-ui, sans-serif',
        fontSize:'17px', fontWeight:500, color:C.text,
        lineHeight:1.18, letterSpacing:'-.005em',
      }}>{stage.name}</h3>
      <p style={{
        fontSize:'11px', color:C.textSec,
        lineHeight:1.55, fontWeight:400, textWrap:'pretty',
        overflowWrap:'break-word', wordBreak:'break-word',
      }}>{stage.description}</p>
    </div>
  );
};

/* ── TASKS HEADER ── */
const TasksHeader = () => {
  const ctx = React.useContext(DataCtx);
  const isEn = ctx?.lang === 'EN';
  return (
  <div style={{
    padding:'20px 20px 22px',
    background:C.bg, height:'100%',
    display:'flex', flexDirection:'column', justifyContent:'flex-start', gap:'5px',
    borderRight:`1px solid ${C.border}`,
  }}>
    <h3 style={{
      fontFamily:'DM Sans, system-ui, sans-serif',
      fontSize:'15px', fontWeight:500, color:C.text,
      lineHeight:1.28, letterSpacing:'-.005em', textWrap:'pretty',
    }}>{isEn ? 'Key challenges' : 'Типовые задачи,'}<br/>{isEn ? 'we work on' : 'с которыми мы работаем'}</h3>
    <p style={{ fontSize:'10.5px', color:C.textMuted, lineHeight:1.5, fontWeight:400 }}>
      {isEn ? 'Click a challenge → expand solutions' : 'Нажмите задачу → раскрыть решения'}
    </p>
  </div>
);};

/* ── PROBLEM RECT ── */
const ProblemRect = ({ problem, isOpen, onToggle }) => {
  const [hov, setHov] = useState(false);
  const active = isOpen || hov;
  return (
    <button onClick={onToggle} aria-expanded={isOpen}
      className="prob-btn"
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        height:`${PROB_H}px`, width:'100%', textAlign:'left', cursor:'pointer',
        background: isOpen ? C.surfaceHov : hov ? 'rgba(30,24,16,0.02)' : C.surface,
        border:`1px solid ${active ? C.borderHov : C.border}`,
        borderRadius:'8px',
        padding:'15px 38px 15px 15px',
        display:'flex', flexDirection:'column', gap:'6px',
        position:'relative', overflow:'hidden',
        transition:'background .15s ease, border-color .15s ease',
      }}
    >
      <span style={{
        fontFamily:'DM Sans, system-ui, sans-serif',
        fontSize:'14.5px', fontWeight:600, color:C.text,
        lineHeight:1.26, letterSpacing:'-.005em', textWrap:'pretty',
      }}>{problem.title}</span>
      <span style={{
        fontSize:'10.5px', color:'#86868B',
        lineHeight:1.55, fontWeight:400, fontStyle:'italic', textWrap:'pretty',
      }}>{problem.painLine}</span>
      <span style={{
        position:'absolute', top:'12px', right:'12px',
        width:'20px', height:'20px', borderRadius:'50%',
        border:`1px solid ${isOpen ? C.accent : C.borderMid}`,
        background: isOpen ? C.accent : 'transparent',
        display:'flex', alignItems:'center', justifyContent:'center',
        color: isOpen ? '#fff' : C.textMuted,
        fontSize:'10px', lineHeight:1,
        transform: isOpen ? 'rotate(180deg)' : 'none',
        transition:'transform .22s ease, background .15s ease, color .15s ease, border-color .15s ease',
      }}>⌄</span>
    </button>
  );
};

/* ── STAGE CELL ── */
const StageCell = ({ cards, isOpen, isLastCol, onCardClick }) => (
  <div style={{
    padding: isOpen ? '14px 12px' : '0',
    borderRight: isLastCol ? 'none' : `1px solid ${C.border}`,
    display:'flex', flexDirection:'column', gap:'10px',
    minWidth:0,
  }}>
    {isOpen && (
      cards.length > 0
        ? cards.map(c => <CardTile key={c.id} card={c} onClick={() => onCardClick(c)} />)
        : <div style={{ minHeight:'60px', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <span style={{ fontSize:'20px', color:'rgba(30,24,16,0.08)', lineHeight:1 }}>·</span>
          </div>
    )}
  </div>
);

const SubblockDivider = () => (
  <div style={{ height:'1px', background:'rgba(30,24,16,0.07)', gridColumn:'1 / -1' }} />
);

/* ── BLOCK RAIL ── */
const BlockRail = ({ block, allOpen, onToggleAll }) => {
  const dc2 = React.useContext(DataCtx);
  const paras = splitSpine(block.spine);
  return (
    <aside style={{
      width:`${RAIL_W}px`, flexShrink:0,
      borderRight:'2px solid rgba(245,240,232,0.15)',
      background:C.rail,
    }}>
      <div style={{
        position:'sticky', top:`${HEADER_H + STAGE_BAR_H}px`,
        padding:'clamp(32px,5vh,56px) 22px 28px 22px',
      }}>
        <h2 style={{
          fontFamily:'DM Sans, system-ui, sans-serif',
          fontSize:'22px', fontWeight:600, color:'#F5F5F7',
          lineHeight:1.13, letterSpacing:'-.01em', marginBottom:'4px',
        }}>{block.title}</h2>

        <span style={{
          display:'block', fontSize:'12px', color:'rgba(245,240,232,0.62)',
          fontStyle:'italic', fontWeight:500, marginBottom:'16px',
        }}>{block.tagline}</span>

        <div style={{ width:'28px', height:'1.5px', background:'rgba(245,240,232,0.35)', marginBottom:'18px' }} />

        {paras.map((p, i) => (
          <p key={i} style={{
            fontSize:'12px', color:'rgba(245,240,232,0.58)', lineHeight:1.75,
            fontWeight:400, textWrap:'pretty',
            marginBottom: i < paras.length - 1 ? '14px' : '24px',
          }}>{p}</p>
        ))}

        <button onClick={onToggleAll}
          style={{
            display:'inline-flex', alignItems:'center', gap:'7px',
            background: allOpen ? 'rgba(245,240,232,0.10)' : 'rgba(245,240,232,0.15)',
            color:'rgba(245,240,232,0.85)',
            border: allOpen ? '1px solid rgba(245,240,232,0.20)' : '1px solid rgba(245,240,232,0.30)',
            padding:'8px 15px', borderRadius:'7px',
            fontSize:'11px', fontWeight:600, letterSpacing:'.03em',
            cursor:'pointer', whiteSpace:'nowrap',
            transition:'background .15s, border-color .15s',
          }}
        >
          <span style={{ color:'rgba(245,240,232,0.80)' }}>{allOpen ? (dc2?.lang==='EN' ? 'Collapse all' : 'Свернуть всё') : (dc2?.lang==='EN' ? 'Expand all' : 'Показать всё')}</span>
          <span style={{ fontSize:'8px', opacity:.6, color:'rgba(245,240,232,0.80)' }}>{allOpen ? '▲' : '▼'}</span>
        </button>
      </div>
    </aside>
  );
};

/* ── DRAWER ── */
const Drawer = ({ card, onClose, onJump }) => {
  useEffect(() => {
    const h = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);

  if (!card) return null;

  const dc = React.useContext(DataCtx);
  const block    = (dc ? dc.BLOCK_BY_ID : BLOCK_BY_ID)[card.blockId];
  const imp      = IMPACT_P[card.impact]  || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const scl      = SCALE_P[card.scale]    || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const dcDrawer   = dc ? dc.DRAWER_CONTENT : DRAWER_CONTENT;
  const dcCards    = dc ? dc.CARDS          : CARDS;
  const dcCardById = dc ? dc.CARD_BY_ID     : CARD_BY_ID;
  const dcStageById= dc ? dc.STAGE_BY_ID    : STAGE_BY_ID;
  const d_ctx    = dcDrawer[card.id];
  const opens    = (card.flowsTo || []).map(id => dcCardById[id]).filter(Boolean);
  const requires = dcCards.filter(c => (c.flowsTo || []).includes(card.id));

/* ── BLOCK CANVAS ── */
const BlockCanvas = ({ block, openProblems, onToggleProblem, onToggleAll, onCardClick, isLast }) => {
  const dc2 = React.useContext(DataCtx);
  const blockProblems = useMemo(
    () => (dc2 ? dc2.PROBLEMS : PROBLEMS).filter(p => p.blockId === block.id).sort((a, b) => (a.sequence||0) - (b.sequence||0)),
    [block.id, dc2]
  );
  const cardsByPS = useMemo(() => {
    const out = {};
    for (const p of blockProblems) out[p.id] = { 1:[], 2:[], 3:[] };
    for (const c of (dc2 ? dc2.CARDS : CARDS)) {
      if (!out[c.problemId]) continue;
      out[c.problemId][c.stage].push(c);
    }
    for (const p of blockProblems)
      for (const s of [1,2,3])
        out[p.id][s].sort((a,b) => (a.sequence||0)-(b.sequence||0));
    return out;
  }, [blockProblems, dc2]);
  const allOpen = blockProblems.length > 0 && blockProblems.every(p => openProblems.has(p.id));

  return (
    <div data-block-code={block.code} style={{
      display:'flex', alignItems:'stretch',
      border:`1px solid ${C.border}`,
      borderTop:'none', background:C.bg,
      marginBottom: isLast ? 0 : '28px',
      borderRadius:'0 0 10px 10px',
      overflow:'hidden',
    }}>
      <BlockRail block={block} allOpen={allOpen} onToggleAll={() => onToggleAll(blockProblems)} />
      <section style={{ flex:1, minWidth:0 }}>
        {blockProblems.map((p, i) => {
          const isOpen    = openProblems.has(p.id);
          const isLastRow = i === blockProblems.length - 1;
          const sub  = p.subBlockId ? SUBBLOCK_BY_ID[p.subBlockId] : null;
          const prev = i > 0 ? blockProblems[i - 1] : null;
          const showSub = sub && (!prev || prev.subBlockId !== p.subBlockId);
          return (
            <React.Fragment key={p.id}>
              {showSub && <SubblockDivider />}
              <div style={{
                display:'grid', gridTemplateColumns:GRID_COLS,
                borderBottom: isLastRow ? 'none' : `1px solid ${C.border}`,
                background: isOpen ? 'rgba(30,24,16,0.015)' : 'transparent',
                transition:'background .15s ease',
              }}>
                <div style={{ padding:'13px', borderRight:`1px solid ${C.border}`, display:'flex' }}>
                  <ProblemRect problem={p} isOpen={isOpen} onToggle={() => onToggleProblem(p.id)} />
                </div>
                {[1,2,3].map((sid, si) => (
                  <StageCell key={sid} cards={cardsByPS[p.id][sid]} isOpen={isOpen} isLastCol={si===2} onCardClick={onCardClick} />
                ))}
              </div>
            </React.Fragment>
          );
        })}
      </section>
    </div>
  );
};

              <SectionLabelP>{isEn ? 'Outputs' : 'На выходе'}</SectionLabelP>
              <ul style={{ margin:'6px 0 0 0', padding:'0 0 0 16px', display:'grid', gap:'5px' }}>
                {(step.outputs || []).map(o => <li key={o} style={{ fontSize:'12px', color:C.textSec, lineHeight:1.5 }}>{o}</li>)}
              </ul>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const renderTeam = () => (
    <div>
      <div style={{ maxWidth:'820px', marginBottom:'28px' }}>
        <p style={{ fontSize:'11px', color:C.textMuted, textTransform:'uppercase', letterSpacing:'.1em', fontWeight:500, marginBottom:'10px' }}>{team.title}</p>
        <h2 style={{ fontFamily:'DM Sans, system-ui, sans-serif', fontSize:'clamp(28px,3.5vw,44px)', fontWeight:400, color:C.text, marginBottom:'14px', lineHeight:1.14 }}>{isEn ? "We sit on the owner's side of the table." : '\u041e\u0442\u0440\u0430\u0441\u043b\u0435\u0432\u0430\u044f \u044d\u043a\u0441\u043f\u0435\u0440\u0442\u0438\u0437\u0430 \u0438 \u0442\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u043f\u043e\u0441\u0442\u0430\u0432\u043a\u0430 \u2014 \u0432 \u043e\u0434\u043d\u043e\u0439 \u043a\u043e\u043c\u0430\u043d\u0434\u0435'}</h2>
        <p style={{ fontSize:'16px', color:C.textSec, lineHeight:1.72, fontWeight:300, marginBottom:'8px' }}>{team.lead}</p>
        {team.sublead && <p style={{ fontSize:'14px', color:C.textMuted, lineHeight:1.65, fontWeight:300 }}>{team.sublead}</p>}
      </div>
      <div style={{ display:'grid', gap:'24px' }}>
        {(team.groups || []).map(group => (
          <section key={group.id}>
            <SectionLabelP>{group.title}</SectionLabelP>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))', gap:'10px', marginTop:'10px' }}>
              {(group.members || []).map(member => (
                <div key={member.name} style={{ padding:'16px', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'8px', display:'grid', gap:'10px' }}>
                  <div style={{ display:'flex', gap:'12px', alignItems:'flex-start' }}>
                    <div style={{ width:'40px', height:'40px', borderRadius:'50%', overflow:'hidden', background:C.bg, border:`1px solid ${C.border}`, color:C.accentText, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'12px', fontWeight:700, flexShrink:0 }}>{member.photo ? <img src={member.photo} alt={member.name} style={{ width:'100%', height:'100%', objectFit:'cover' }} /> : member.initials}</div>
                    <div>
                      <h3 style={{ fontSize:'15px', color:C.text, fontWeight:600, marginBottom:'4px', lineHeight:1.25 }}>{member.name}</h3>
                      <p style={{ fontSize:'12px', color:C.textSec, lineHeight:1.5, fontWeight:300 }}>{member.line}</p>
                    </div>
                  </div>
                  <div style={{ display:'flex', gap:'5px', flexWrap:'wrap', width:'fit-content' }}>
                    {(member.chips || []).map(chip => <ProfileChip key={chip} label={chip} />)}
                  </div>
                </div>
              ))}
            </div>
          </section>
        ))}
      </div>
      {team.benchNote && <div style={{ marginTop:'20px', padding:'15px 18px', background:C.bg, border:`1px solid ${C.border}`, borderRadius:'8px' }}><p style={{ fontSize:'13px', color:C.textSec, lineHeight:1.6 }}>{team.benchNote}</p></div>}
    </div>
  );

  const renderContact = () => (
    <div style={{ maxWidth:'900px' }}>
      <p style={{ fontSize:'11px', color:C.textMuted, textTransform:'uppercase', letterSpacing:'.1em', fontWeight:500, marginBottom:'10px' }}>{contact.title}</p>
      <h2 style={{ fontFamily:'DM Sans, system-ui, sans-serif', fontSize:'clamp(22px,2.4vw,38px)', fontWeight:400, color:C.text, marginBottom:'28px', lineHeight:1.22, textWrap:'pretty' }}>{contact.lead}</h2>
      <div style={{ padding:'22px', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'8px', display:'grid', gap:'16px' }}>
        <div><SectionLabelP>Email</SectionLabelP><a href={`mailto:${contact.email}`} style={{ color:C.text, fontSize:'16px', textDecoration:'none' }}>{contact.email}</a></div>
        <div><SectionLabelP>{isEn ? 'Website' : 'Сайт'}</SectionLabelP><a href={`https://${contact.website}`} style={{ color:C.text, fontSize:'16px', textDecoration:'none' }}>{contact.website}</a></div>
        <div><SectionLabelP>{isEn ? 'Company' : 'Компания'}</SectionLabelP><p style={{ color:C.textSec, fontSize:'14px', lineHeight:1.6, margin:0 }}>{contact.company}<br/>{contact.location}</p></div>
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, padding:'clamp(28px,4vh,52px) clamp(20px,4vw,72px) 80px', maxWidth:'1200px', margin:'0 auto', width:'100%', boxSizing:'border-box' }}>
      {active === 'company'      && renderCompany()}
      {active === 'how-we-work'  && renderHow()}
      {active === 'team'         && renderTeam()}
      {active === 'contact'      && renderContact()}

      {activeCase && (
        <div style={{ position:'fixed', inset:0, zIndex:60 }}>
          <div style={{ position:'absolute', inset:0, background:'rgba(20,16,10,0.45)' }} onClick={() => setActiveCase(null)} />
          <div style={{ position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)', width:'min(860px,calc(100vw - 32px))', maxHeight:'calc(100vh - 48px)', overflow:'auto', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'10px', boxShadow:'0 18px 48px rgba(0,0,0,.16)' }}>
            <div style={{ padding:'18px 20px', borderBottom:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', gap:'12px', alignItems:'flex-start' }}>
              <div>
                <div style={{ fontSize:'11px', color:C.accentText, fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', marginBottom:'6px' }}>{activeCase.label}</div>
                {activeCase.meta && <div style={{ fontSize:'11px', color:C.textMuted, marginBottom:'8px' }}>{activeCase.meta}</div>}
                <h3 style={{ fontSize:'22px', color:C.text, fontWeight:600, lineHeight:1.2, margin:0 }}>{activeCase.focus}</h3>
              </div>
              <button onClick={() => setActiveCase(null)} style={{ background:'none', border:`1px solid ${C.border}`, width:'30px', height:'30px', borderRadius:'50%', cursor:'pointer', color:C.textSec, flexShrink:0 }}>×</button>
            </div>
            <div style={{ padding:'22px 20px', display:'grid', gap:'16px' }}>
              {activeCase.detail?.context && <div><SectionLabelP>{isEn ? 'Business context' : 'Бизнес-контекст'}</SectionLabelP><p style={{ fontSize:'14px', color:C.textSec, lineHeight:1.65, fontWeight:300, marginTop:'6px' }}>{activeCase.detail.context}</p></div>}
              {activeCase.detail?.role && <div><SectionLabelP>{isEn ? 'Our role' : 'Наша роль'}</SectionLabelP><p style={{ fontSize:'14px', color:C.textSec, lineHeight:1.65, fontWeight:300, marginTop:'6px' }}>{activeCase.detail.role}</p></div>}
              {!!(activeCase.detail?.scope?.length) && <div><SectionLabelP>{isEn ? 'What we did' : 'Что делали'}</SectionLabelP><ul style={{ margin:'6px 0 0 0', padding:'0 0 0 18px', display:'grid', gap:'6px' }}>{activeCase.detail.scope.map(p => <li key={p} style={{ fontSize:'13px', color:C.textSec, lineHeight:1.55 }}>{p}</li>)}</ul></div>}
              {!!(activeCase.detail?.outcome?.length) && <div><SectionLabelP>{isEn ? 'Business outcome' : 'Бизнес-результат'}</SectionLabelP><ul style={{ margin:'6px 0 0 0', padding:'0 0 0 18px', display:'grid', gap:'6px' }}>{activeCase.detail.outcome.map(p => <li key={p} style={{ fontSize:'13px', color:C.textSec, lineHeight:1.55 }}>{p}</li>)}</ul></div>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── APP ── */
const App = () => {
  const [screen, setScreen] = useState('home');
  const [profileSection, setProfileSection] = useState('company');
  const [activeCardId, setActiveCardId] = useState(null);

  /* ── Language switcher ── */
  const [lang, setLang] = useState('EN');
  const d = useMemo(() => getData(lang), [lang]);
  const [langToast, setLangToast] = useState(null);
  const [langOpen, setLangOpen] = useState(false);
  const LANGS = [
    { code:'EN', available:true  },
    { code:'RU', available:true  },
    { code:'ES', available:false },
    { code:'DE', available:false },
    { code:'FR', available:false },
  ];
  const handleLang = (l) => {
    if (l.available) { setLang(l.code); }
    else { setLangToast(l.code); setTimeout(() => setLangToast(null), 2800); }
  };
  const LangSwitcher = () => (
    <div style={{ position:'relative' }}>
      <button onClick={() => setLangOpen(o => !o)} style={{
        display:'flex', alignItems:'center', gap:'7px',
        background:'none', border:`1px solid ${C.border}`, borderRadius:'3px',
        padding:'6px 10px', cursor:'pointer', fontSize:'12.5px', fontWeight:600,
        color:C.text, transition:'border-color .13s',
      }}
      onMouseEnter={e=>e.currentTarget.style.borderColor=C.borderHov}
      onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}
      >
        {lang==='EN'
          ? <svg width="18" height="13" viewBox="0 0 60 30" preserveAspectRatio="none" style={{display:'block',borderRadius:'2px',border:`1px solid ${C.border}`}}><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30 M60,0 0,30" stroke="#fff" strokeWidth="6"/><path d="M0,0 60,30 M60,0 0,30" stroke="#C8102E" strokeWidth="4"/><rect x="25" width="10" height="30" fill="#fff"/><rect y="10" width="60" height="10" fill="#fff"/><rect x="27" width="6" height="30" fill="#C8102E"/><rect y="12" width="60" height="6" fill="#C8102E"/></svg>
          : <svg width="18" height="13" viewBox="0 0 9 6" preserveAspectRatio="none" style={{display:'block',borderRadius:'2px',border:`1px solid ${C.border}`}}><rect width="9" height="2" fill="#fff"/><rect y="2" width="9" height="2" fill="#0039A6"/><rect y="4" width="9" height="2" fill="#D52B1E"/></svg>}
        {lang}
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke={C.textMuted} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </button>
      {langOpen && (
        <>
          <div onClick={() => setLangOpen(false)} style={{ position:'fixed', inset:0, zIndex:998 }} />
          <div style={{
            position:'absolute', top:'calc(100% + 6px)', right:0,
            background:C.surface, border:`1px solid ${C.border}`,
            borderRadius:'9px', boxShadow:'0 4px 20px rgba(0,0,0,0.10)',
            padding:'4px', zIndex:999, minWidth:'130px',
          }}>
            {LANGS.map(l => (
              <button key={l.code} onClick={() => { handleLang(l); setLangOpen(false); }} style={{
                display:'flex', alignItems:'center', justifyContent:'space-between',
                width:'100%', padding:'7px 12px', border:'none', borderRadius:'6px',
                background: lang===l.code ? C.bg : 'transparent',
                cursor:'pointer', fontSize:'12.5px', fontWeight: lang===l.code ? 600 : 400,
                color: l.available ? C.text : C.textMuted,
                textAlign:'left',
              }}>
                <span>{l.code}</span>
                {!l.available && <span style={{ fontSize:'9px', color:C.textMuted, fontStyle:'italic' }}>{lang==='EN' ? 'soon' : 'скоро'}</span>}
                {lang===l.code && <span style={{ color:C.accent, fontSize:'11px' }}>✓</span>}
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
  const AdvisorBtn = () => (
    <button style={{
      display:'flex', alignItems:'center', gap:'8px',
      background:'linear-gradient(118deg,#FF9D2E 0%,#FF6A00 52%,#F5481F 100%)', color:'#fff',
      border:'1px solid transparent', borderRadius:'3px',
      padding:'8px 15px',
      fontSize:'12.5px', fontWeight:600, cursor:'pointer',
      letterSpacing:'.01em', transition:'opacity .15s',
    }}
    onMouseEnter={e=>e.currentTarget.style.opacity='0.92'}
    onMouseLeave={e=>e.currentTarget.style.opacity='1'}
    >
      <span aria-hidden="true" style={{ fontSize:'13px' }}>✦</span>
      <span>{lang === 'EN' ? 'Ask AI Advisor' : 'Спросить AI Советника'}</span>
      <span style={{ display:'inline-flex', gap:'2px' }}>
        <kbd style={{ fontFamily:'inherit', fontSize:'10px', lineHeight:1, background:'rgba(255,255,255,0.22)', border:'1px solid rgba(255,255,255,0.34)', borderRadius:'2px', padding:'2px 4px', color:'#fff' }}>⌘</kbd>
        <kbd style={{ fontFamily:'inherit', fontSize:'10px', lineHeight:1, background:'rgba(255,255,255,0.22)', border:'1px solid rgba(255,255,255,0.34)', borderRadius:'2px', padding:'2px 4px', color:'#fff' }}>K</kbd>
      </span>
    </button>
  );
  const [openProblems, setOpenProblems] = useState(() => new Set());

  const goProfile = useCallback((sec='company') => { setProfileSection(sec); setScreen('profile'); window.scrollTo({ top:0, behavior:'smooth' }); }, []);
  const goHome = useCallback(() => { setScreen('home'); window.scrollTo({ top:0, behavior:'smooth' }); }, []);

  const toggleProblem    = useCallback(id => setOpenProblems(prev => { const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; }), []);
  const toggleAllInBlock = useCallback(bps => setOpenProblems(prev => { const n=new Set(prev); const all=bps.length>0&&bps.every(p=>n.has(p.id)); all?bps.forEach(p=>n.delete(p.id)):bps.forEach(p=>n.add(p.id)); return n; }), []);
  const openCard   = useCallback(card => setActiveCardId(card.id), []);
  const closeCard  = useCallback(() => setActiveCardId(null), []);
  const jumpToCard = useCallback(id => setActiveCardId(id), []);
  const activeCard = activeCardId ? (d.CARD_BY_ID[activeCardId] || null) : null;

  const scrollToBlock = useCallback((code) => {
    const el = document.querySelector(`[data-block-code="${code}"]`);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - HEADER_H - 8;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }, []);

  const scrollToCatalog = useCallback(() => {
    const el = document.getElementById('catalog-main');
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - HEADER_H - 8;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }, []);

  return (
    <DataCtx.Provider value={{...d, lang}}>
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:C.bg }}>

      <header style={{
        height:`${HEADER_H}px`,
        background:C.surface, borderBottom:`1px solid ${C.border}`,
        flexShrink:0, position:'sticky', top:0, zIndex:40,
      }}>
        <div style={{
          maxWidth:'1120px', margin:'0 auto', width:'100%', height:'100%',
          padding:'0 clamp(20px,4vw,48px)', boxSizing:'border-box',
          display:'flex', alignItems:'center', justifyContent:'space-between', gap:'24px',
        }}>
        <Wordmark lang={lang} />
        <nav style={{ display:'flex', alignItems:'center', gap:'28px' }}>
          {screen === 'profile' && (
            <button onClick={goHome} style={{ background:'none', border:'none', cursor:'pointer', color:C.textSec, fontSize:'13px', padding:'4px 0', display:'flex', alignItems:'center', gap:'4px', letterSpacing:'.02em' }}>{lang==='EN' ? '← Catalog' : '← Каталог'}</button>
          )}
          {[{id:'company',label: lang==='EN'?'About':'О нас'},{id:'how-we-work',label:lang==='EN'?'How we work':'Как работаем'},{id:'team',label:lang==='EN'?'Team':'Команда'},{id:'contact',label:lang==='EN'?'Contact':'Контакты'}].map(item => {
            const isAct = screen==='profile' && profileSection===item.id;
            return (
            <button key={item.id} onClick={() => goProfile(item.id)}
              style={{
                background: 'none',
                border: 'none',
                borderBottom: isAct ? '2px solid #FF6A00' : '2px solid transparent',
                padding: '4px 0',
                cursor: 'pointer',
                fontSize: '13px',
                fontWeight: isAct ? 600 : 500,
                color: isAct ? C.text : C.textSec,
                letterSpacing: '.02em',
                transition: 'color .15s',
              }}
              onMouseEnter={e => { if(!isAct) e.currentTarget.style.color = C.text; }}
              onMouseLeave={e => { if(!isAct) e.currentTarget.style.color = C.textSec; }}
            >{item.label}</button>
            );
          })}
        </nav>
        <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
          <AdvisorBtn />
          <LangSwitcher />
        </div>
        </div>
      </header>
      {langToast && (
        <div style={{
          position:'fixed', bottom:'28px', left:'50%', transform:'translateX(-50%)',
          background:'#1D1D1F', color:'#F5F5F7',
          padding:'10px 20px', borderRadius:'10px',
          fontSize:'13px', fontWeight:500, zIndex:9999,
          boxShadow:'0 4px 20px rgba(0,0,0,0.18)',
          pointerEvents:'none', whiteSpace:'nowrap',
        }}>
          {langToast} — перевод пока не добавлен
        </div>
      )}

      {screen === 'home' && <HeroScreen onScrollToCatalog={scrollToCatalog} onScrollToBlock={scrollToBlock} lang={lang} />}

      {screen === 'profile' && (
        <KKProfileScreen section={profileSection} onBack={goHome} onNav={goProfile} lang={lang} />
      )}

      <main id="catalog-main" style={{ display: screen === 'profile' ? 'none' : undefined, flex:1, padding:'clamp(20px,3vh,36px) clamp(20px,3vw,40px) 80px' }}>

        <div style={{
          position:'sticky', top:`${HEADER_H}px`, zIndex:30,
          display:'grid', gridTemplateColumns:`${RAIL_W}px ${GRID_COLS}`,
          background:C.surface,
          border:`1px solid ${C.border}`,
          borderBottom:`1px solid ${C.borderMid}`,
          borderRadius:'10px 10px 0 0', overflow:'hidden',
        }}>
          <div style={{ borderRight:'2px solid rgba(245,240,232,0.15)', background:C.rail }} />
          <TasksHeader />
          {d.STAGES.map((s, idx) => (
            <div key={`${s.id}-${lang}`} style={{ borderRight: idx < d.STAGES.length-1 ? `1px solid ${C.border}` : 'none', minWidth:0 }}>
              <StageHeader stage={s} />
            </div>
          ))}
        </div>

        {d.BLOCKS.map((block, idx) => (
          <BlockCanvas key={`${block.id}-${lang}`} block={block}
            openProblems={openProblems} onToggleProblem={toggleProblem}
            onToggleAll={toggleAllInBlock} onCardClick={openCard}
            isLast={idx === d.BLOCKS.length - 1}
          />
        ))}
      </main>

      {activeCard && <Drawer card={activeCard} onClose={closeCard} onJump={jumpToCard} />}
    </div>
    </DataCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


  <script src="/device-hint.js?v=2" defer></script>
  <script src="/advisor.js?v=10" defer></script>
</body></html>
