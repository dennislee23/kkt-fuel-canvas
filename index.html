<h1>Fuel AI Transformation Map — KKT</h1>
<p>An interactive map of where data and AI deliver measurable results across a fuel-retail network, published by Kitty Kat Technologies (KKT), a data, AI and automation delivery firm in Tallinn, Estonia (EU). It spans the whole network economy — procurement and margin, logistics, stations and shops, customers, finance and control — built bottom-up: connected data and control first, then AI where it earns its place. KKT’s marquee fuel deployment is Optimus, a procurement-and-margin engine in pilot at Red Petroleum, a 250-station independent fuel network in Kyrgyzstan.</p>
<h2>Maturity stages</h2><ul>
<li><strong>Essential Solutions</strong> — Can be launched quickly on existing data. Deliver a clear effect without major process redesign.</li>
<li><strong>Advanced Solutions</strong> — Require more mature data, integrations, and models. Deliver greater impact by optimizing decisions and processes.</li>
<li><strong>Agentic and System-Level Solutions</strong> — End-to-end solutions and AI agents that work on top of a built foundation. A human sets the rules and controls the result.</li>
</ul>
<h2>The map — 7 domains, 41 challenges, 106 solutions</h2>
<h3>A — Fuel: Procurement, Pricing and Margin</h3>
<p>We help manage procurement and pricing as one commercial loop: forecast demand, choose the supplier and buying moment, account for the full landed cost of each batch, and manage pump price with market and demand in mind. The focus is fewer shortages and surpluses, lower overpayment, better margin, and faster commercial decisions.</p>
<h4>A1 · Buy fuel in the right volume and at the right time — Orders matched to real demand: fewer shortages and surpluses, less frozen capital.</h4><ul>
<li>See demand and inventory in one view <em>(Essential Solutions)</em> — How much is needed and how much is already available, so procurement is not done blindly.</li>
<li>Demand forecast by station and terminal <em>(Advanced Solutions)</em> — How much will be sold, taking season, weather, and events into account.</li>
<li>Procurement agent under operator control <em>(Agentic and System-Level Solutions)</em> [prerequisite] — The system prepares the request according to rules; a human approves it.</li>
<li>Smart procurement: how much, when, and at what price to buy <em>(Advanced Solutions)</em> [prerequisite] — A ready decision for the current task: buy cheaper, freeze less capital, or protect supply.</li>
</ul>
<h4>A2 · Choose the supplier and procurement terms — Transparent comparison of price, timing, and terms; procurement at a favorable price moment.</h4><ul>
<li>Compare suppliers by price, timing, and terms <em>(Essential Solutions)</em> — Price, delivery timing, payment deferral, and reliability in one view: selection based on substance, not habit.</li>
<li>Choose the best buying moment <em>(Advanced Solutions)</em> [prerequisite] — See where the purchase price is moving and buy at the right moment.</li>
</ul>
<h4>A3 · Account for the full landed cost of a batch in procurement — Logistics, demurrage, downtime, customs, and penalties are included in the batch economics before the buying decision, instead of surfacing after the fact</h4><ul>
<li>Know what the batch really cost <em>(Essential Solutions)</em> — Price plus logistics, demurrage, downtime, customs, and penalties in one number.</li>
<li>See in advance where a batch is becoming more expensive <em>(Advanced Solutions)</em> [prerequisite] — Risk of downtime, penalty, or delay before it lands in cost of goods.</li>
</ul>
<h4>A4 · Manage price with market and demand in mind — Price changes based on data and on time, not after the market has already moved.</h4><ul>
<li>See your price against competitors <em>(Essential Solutions)</em> — Market prices next to your own, so you are not falling behind blindly.</li>
<li>Understand where price can be raised without losing customers <em>(Advanced Solutions)</em> [prerequisite] — Where there is price headroom, and where price is pushing the customer to a competitor.</li>
<li>Dynamic pricing <em>(Agentic and System-Level Solutions)</em> [prerequisite] — Price adjusts to demand, competitors, and time automatically, under rule-based control.</li>
</ul>
<h3>B — Logistics and Fuel Supply</h3>
<p>We help make fuel supply manageable end to end: see batch movement, delay risks, acceptance discrepancies, railcars and demurrage, terminal operations, delivery to stations, and trip execution. The focus is fewer losses, delays, penalties, and less manual dispatching.</p>
<h4>B1.1 · Control supply movement and delay risks — Arrival forecast and an early delay signal, so there is time to respond.</h4><ul>
<li>See where the batch is and when it will arrive <em>(Essential Solutions)</em> — Supply status in one view, not through phone calls.</li>
<li>Learn about delay risk in advance <em>(Advanced Solutions)</em> [prerequisite] — See a disruption before it happens.</li>
</ul>
<h4>B1.2 · Find where supply discrepancies create losses — Ordered, shipped, accepted: where there is shortage, loss, or manipulation.</h4><ul>
<li>Catch shortage at acceptance <em>(Essential Solutions)</em> — Reconcile ordered / shipped / accepted.</li>
<li>Understand where losses are systemic <em>(Advanced Solutions)</em> [prerequisite] — Distinguish a one-off discrepancy from recurring leakage by supplier or route.</li>
</ul>
<h4>B1.3 · Control railcars and demurrage — Railcar downtime, unloading, and turnaround: demurrage and penalties under control, not discovered through an invoice after the fact.</h4><ul>
<li>See railcar status and downtime <em>(Essential Solutions)</em> — Where the railcar is, what it costs, how much time remains before a penalty, and who must respond.</li>
<li>Reduce demurrage and railcar downtime <em>(Advanced Solutions)</em> [prerequisite] — See which railcars are approaching a penalty and where unloading is blocked before the invoice arrives.</li>
</ul>
<h4>B2.1 · Control loading/unloading and process losses — Loading/unloading acts, actual volumes, temperature corrections, and natural loss are controlled instead of written off after the fact</h4><ul>
<li>Reconcile loading/unloading act with actual volume <em>(Essential Solutions)</em> — Discrepancies between the operation act and actual volume are visible immediately, not only at inventory count</li>
<li>Separate normal allowance from loss <em>(Advanced Solutions)</em> [prerequisite] — Where it is natural loss and temperature correction, and where it is real leakage or a violation for investigation</li>
</ul>
<h4>B2.2 · Control quality and tank utilization at the terminal — Fuel allocation across tanks, quality control, and storage standards.</h4><ul>
<li>Keep quality under control <em>(Essential Solutions)</em> — Quality deviations before they reach the customer.</li>
<li>Use tanks properly <em>(Advanced Solutions)</em> [prerequisite] — Allocation across tanks without idle capacity or unacceptable mixing.</li>
</ul>
<h4>B3.1 · Plan fuel delivery to stations — Which fuel product, to which stations, from which terminals, and in what volume</h4><ul>
<li>See which station needs fuel <em>(Essential Solutions)</em> — Network demand in one view: who is close to running dry.</li>
<li>Automatic station delivery plan <em>(Advanced Solutions)</em> [prerequisite] — A ready plan of what to deliver, from where, and in what volume, based on demand and forecast.</li>
<li>Dispatcher agent under control <em>(Agentic and System-Level Solutions)</em> [prerequisite] — The system builds the dispatch plan according to rules; a human approves it.</li>
</ul>
<h4>B3.2 · Routing and trip execution — The best route, the right tanker and driver, and in-transit tracking.</h4><ul>
<li>See where vehicles are and what is in transit <em>(Essential Solutions)</em> — Track trips and delivery status instead of learning after the fact.</li>
<li>Optimal route, vehicle, and driver <em>(Advanced Solutions)</em> [prerequisite] — Less empty mileage and downtime, with vehicle assignment matched to the trip.</li>
</ul>
<h4>B3.3 · Trip accounting and control — Trip plan-versus-actual, deviation analysis, manipulation detection, and camera-based driver safety control.</h4><ul>
<li>Trip plan-versus-actual <em>(Essential Solutions)</em> — What was executed as planned, and where deviations and losses occurred.</li>
<li>Driver safety control <em>(Essential Solutions)</em> — Speeding, harsh braking, fatigue: an early risk signal, not post-accident analysis.</li>
<li>Detect fuel diversion and manipulation in transit <em>(Advanced Solutions)</em> [prerequisite] — Unauthorized fuel draining and route deviations: direct leakage under control.</li>
</ul>
<h3>C — Stations, Stores and Cafes</h3>
<p>We help manage the station as a profit point, not only as an operating asset: see station underperformance, queues and lost traffic, violations at dispensers and POS, shift execution, equipment, assortment, write-offs, and conversion into the store. The focus is fewer operating losses, higher station revenue, and better customer experience.</p>
<h4>C1.1 · Understand why a station underperforms — Not just station numbers, but the cause: where the station is missing potential and what to do about it.</h4><ul>
<li>Compare stations and see underperformers <em>(Essential Solutions)</em> — Stations compared fairly: who is underperforming against similar stations, not against the average.</li>
<li>Understand the cause, not only the fact <em>(Advanced Solutions)</em> [prerequisite] — Why the station dropped: traffic, price, service, assortment, and what to fix.</li>
<li>Station Analysis Agent <em>(Agentic and System-Level Solutions)</em> [prerequisite] — It analyzes stations, finds causes, forms hypotheses, and highlights where to look.</li>
<li>Plan achievement control and operational response <em>(Essential Solutions)</em> — Station plan in the moment: where we are behind today, not in a report at month-end.</li>
</ul>
<h4>C1.2 · Stop losing sales to queues and traffic leakage — How many customers leave because of a queue, and who entered but did not fuel.</h4><ul>
<li>See how many customers are being lost <em>(Essential Solutions)</em> — Who leaves because of a queue and who entered but did not fuel.</li>
<li>See the hours and points where the station overloads <em>(Advanced Solutions)</em> [prerequisite] — When and where queues build up, so flow can be redistributed or the shift reinforced.</li>
</ul>
<h4>C1.3 · Stop losses at dispensers and POS — Virtual fuelings, underdelivery, manual receipt corrections, and collusion under automatic control.</h4><ul>
<li>Catch losses during fuel dispensing <em>(Essential Solutions)</em> — Virtual fuelings, underdelivery, receipt corrections, and collusion through data and cameras.</li>
</ul>
<h4>C1.4 · Control staff, standards, and service — Shift plan-versus-actual, standards, and safety compliance without manual checks.</h4><ul>
<li>See how the shift works <em>(Essential Solutions)</em> — Shift plan-versus-actual and where standards are not maintained, without inspector rounds.</li>
<li>Detect standards violations on camera <em>(Advanced Solutions)</em> [prerequisite] — Shelf layout, uniform, and safety violations detected automatically, not during a walkthrough.</li>
</ul>
<h4>C1.5 · Keep station equipment running — Prevent downtime of dispensers, refrigerators, and coffee machines instead of reacting after the fact.</h4><ul>
<li>Know what to service and when <em>(Essential Solutions)</em> — Service schedule for dispensers, refrigerators, and coffee machines based on business priority.</li>
<li>Prevent failure before downtime <em>(Advanced Solutions)</em> [prerequisite] — Catch wear in advance, before a dispenser or refrigerator fails during peak hours.</li>
</ul>
<h4>C2.1 · Convert fuel traffic into store purchases — Higher conversion from fueling to store to coffee, and a higher non-fuel ticket.</h4><ul>
<li>Bring the customer from the pump into the store <em>(Essential Solutions)</em> — How many fueling customers reach the store, and where that transition is lost.</li>
<li>Increase the non-fuel ticket with an in-the-moment offer <em>(Advanced Solutions)</em> [prerequisite] — What to offer a fueling customer so they enter and buy more.</li>
</ul>
<h4>C2.2 · Keep the right assortment for each station — What and how much to deliver to a specific station, based on demand rather than a template.</h4><ul>
<li>Understand what really sells at this station <em>(Essential Solutions)</em> — Which products move at a specific station, not one template for all.</li>
<li>Product demand forecast by station <em>(Advanced Solutions)</em> [prerequisite] — How much of what to deliver, including coffee and baked goods by hour.</li>
</ul>
<h4>C2.3 · Reduce write-offs and empty shelves — Fresh and perishable products are marked down on time; shelves are neither empty nor spoiled.</h4><ul>
<li>See where write-offs and empty shelves create losses <em>(Essential Solutions)</em> — Losses from expired fresh goods and from products not being available on the shelf.</li>
<li>Mark down on time and prevent empty shelves <em>(Advanced Solutions)</em> [prerequisite] — The markdown moment for perishables and the reorder point, so losses are not taken from both ends.</li>
</ul>
<h4>C2.4 · Use station traffic for retail media — Physical station traffic becomes the entry point for a retail media product.</h4><ul>
<li>Brand advertising on station traffic <em>(Agentic and System-Level Solutions)</em> — Physical station traffic provides an audience, contact point, and visit context: the entry point to retail media.</li>
</ul>
<h3>D — Customers, Loyalty and B2B</h3>
<p>We help turn the customer base and B2B portfolio into a managed source of growth: understand customer value, prevent churn, increase frequency and ticket, manage promotions, work with feedback, develop retail media, and manage corporate customer profitability. The focus is higher retention, more margin per customer, fewer wasted discounts, and a stronger loyalty program.</p>
<h4>D1.1 · Understand the customer and their economics — Who our customers are, how they behave, and what they are worth.</h4><ul>
<li>Who our customers are and who brings profit <em>(Essential Solutions)</em> — Not card turnover, but who actually earns money for the company.</li>
<li>Behavioral Segmentation with ML <em>(Advanced Solutions)</em> [prerequisite] — Non-obvious groups based on real behavior, more accurate than rules.</li>
<li>Basic Customer Segmentation <em>(Essential Solutions)</em> — Clear groups so customers can be managed differently, not all the same way.</li>
<li>Customer Lifetime Value Forecast (CLV) <em>(Advanced Solutions)</em> [prerequisite] — Who will become valuable, so investment happens in advance, not by looking backward.</li>
<li>Customer 360 Profile <em>(Essential Solutions)</em> — A single profile from all systems, so the customer is visible as a whole and can be managed personally.</li>
</ul>
<h4>D1.2 · Retain customers and prevent churn — Fewer quiet departures and a higher share of stable customers.</h4><ul>
<li>Notice a leaving customer in time <em>(Essential Solutions)</em> — Catch cooling behavior while the customer can still be brought back cheaply.</li>
<li>Predict churn in advance <em>(Advanced Solutions)</em> [prerequisite] — Who is about to leave before obvious signs appear.</li>
<li>Retention on autopilot <em>(Agentic and System-Level Solutions)</em> [prerequisite] — The system catches risk and launches retention under human control.</li>
<li>Know what will retain them <em>(Advanced Solutions)</em> [prerequisite] — The action that will actually bring a specific customer back.</li>
</ul>
<h4>D1.3 · Increase frequency, ticket, and share of non-fuel purchases — More visits, higher ticket, and fueling-to-store conversion.</h4><ul>
<li>Increase ticket through ready bundles <em>(Essential Solutions)</em> — What customers buy together, offered so they buy more per visit.</li>
<li>Personal offer for the customer <em>(Advanced Solutions)</em> [prerequisite] — What to offer so the customer enters the store and buys.</li>
<li>Best moment for an offer <em>(Advanced Solutions)</em> [prerequisite] — Catch when the customer is receptive and make the offer then.</li>
</ul>
<h4>D1.4 · Manage promotions and measure their effectiveness — Discounts go to those whose behavior changes, not to everyone.</h4><ul>
<li>Know whether a promotion really worked <em>(Essential Solutions)</em> — Separate the real promotion effect from what the customer would have bought anyway.</li>
<li>Give discounts to those whose behavior changes <em>(Advanced Solutions)</em> [prerequisite] — Stop paying those who would fuel without a discount.</li>
<li>Promotion engine: targeted campaigns on segments <em>(Agentic and System-Level Solutions)</em> [prerequisite] — Launch personal campaigns at scale and see return immediately.</li>
</ul>
<h4>D1.5 · Work with feedback and voice of customer — Hear the reasons for dissatisfaction and respond quickly.</h4><ul>
<li>Understand what customers complain about <em>(Essential Solutions)</em> — Real reasons for dissatisfaction from reviews, without manual reading.</li>
<li>Detect station problems early <em>(Advanced Solutions)</em> [prerequisite] — A spike in negative feedback for a site is flagged immediately.</li>
<li>AI First-Line Support <em>(Agentic and System-Level Solutions)</em> [prerequisite] — Answers typical customer questions itself and escalates complex cases to a human.</li>
</ul>
<h4>D1.7 · Monetize traffic beyond sales — Customer flow generates direct revenue.</h4><ul>
<li>Earn from brand advertising <em>(Advanced Solutions)</em> — Sell partners access to customer segments, contact moments, and measurable campaigns.</li>
<li>Data platform for partners <em>(Agentic and System-Level Solutions)</em> [prerequisite] — Anonymized analytics and partner access in a protected environment.</li>
</ul>
<h4>D2.1 · Manage B2B portfolio profitability — See which corporate customers earn money and which consume margin.</h4><ul>
<li>See which corporate customers are profitable <em>(Essential Solutions)</em> — Account margin after discounts and payment deferrals: which accounts are unprofitable.</li>
<li>Corporate customer value forecast <em>(Advanced Solutions)</em> [prerequisite] — Which accounts will grow, so investment can be prioritized.</li>
<li>Set terms by risk and value <em>(Advanced Solutions)</em> [prerequisite] — Discount and limit tailored to the specific customer, not "as usual".</li>
<li>Prevent non-payment <em>(Advanced Solutions)</em> — Who risks not paying under deferred terms before the debt becomes overdue.</li>
</ul>
<h4>D2.2 · Retain B2B customers and forecast non-renewal — Fewer quiet departures of corporate customers.</h4><ul>
<li>Notice corporate customer cooling <em>(Essential Solutions)</em> — Declining account volumes while the contract is still active.</li>
<li>Predict non-renewal <em>(Advanced Solutions)</em> [prerequisite] — Which accounts are close to leaving before the contract ends.</li>
</ul>
<h3>E — Finance, Cash and Control</h3>
<p>We help finance see the business in a live picture and find causes of deviations faster: margin, costs, cash, receivables, payment risks, financial losses, and policy violations become visible before they turn into problems. The focus is faster management decisions, fewer leaks, better cash control, and trust in the numbers.</p>
<h4>E1 · See the financial picture here and now — Margin by station, region, and product: an answer to the executive's question immediately, not an export by morning.</h4><ul>
<li>Network finance in a live view <em>(Essential Solutions)</em> — Margin and cash by station, region, and product immediately, not through an export by morning.</li>
<li>Ask for figures in plain language and get an answer <em>(Advanced Solutions)</em> [prerequisite] — Ask about margin or costs as if asking a person, and get an immediate answer without an analyst as intermediary.</li>
</ul>
<h4>E2 · Understand causes of deviations, not only the fact — Why margin fell or costs increased, and what to do about it.</h4><ul>
<li>See immediately what deviated from plan <em>(Essential Solutions)</em> — Where margin fell or costs rose against expectation, without manual reconciliation.</li>
<li>Understand why it deviated and what to do <em>(Advanced Solutions)</em> [prerequisite] — Break the deviation into causes and what can be influenced, not just "here are the numbers".</li>
<li>Financial and Operational Analyst Agent <em>(Agentic and System-Level Solutions)</em> [prerequisite] — A tireless analyst that sees the whole business in numbers: finds leakage points, suggests where to reduce costs, and highlights risks.</li>
</ul>
<h4>E3 · Forecast cash and cash gaps — Know in advance where and when cash will be short.</h4><ul>
<li>See current balances, debts, and obligations <em>(Essential Solutions)</em> — Balances, debts, and obligations: the full cash picture.</li>
<li>Know about a cash gap in advance <em>(Advanced Solutions)</em> [prerequisite] — Where and when cash will be short, considering procurement, inventory, and receivables.</li>
<li>Understand who risks not paying <em>(Advanced Solutions)</em> [prerequisite] — Which debtors put cash at risk, so work is driven by risk, not by a list.</li>
</ul>
<h4>E5 · Detect losses and inconsistencies in finance — Fictitious counterparties, duplicates, and policy deviations are visible instead of surfacing during audit.</h4><ul>
<li>Catch duplicate and fictitious payments <em>(Essential Solutions)</em> — Duplicate invoices, fictitious counterparties, and unnecessary payments before the money leaves.</li>
<li>Catch a policy deviation before payment <em>(Advanced Solutions)</em> [prerequisite] — A rule violation in posting or procurement while the money has not yet left.</li>
</ul>
<h3>F — Support Functions</h3>
<p>We help remove routine work and strengthen control in the functions that support the business: HR, legal, MRO procurement, contractors, internal control, documents, and back office. The focus is less manual work, faster processes, more transparent spending, and violations visible before audit, not after.</p>
<h4>F1 · HR and Personnel — Recruiting, onboarding, field staff control, and retention rely on manual work where automation could have worked long ago.</h4><ul>
<li>AI Assistant for HR Operations <em>(Essential Solutions)</em> — Answers, templates, policies, requests, and onboarding prompts without a manual HR queue.</li>
<li>Recruiting and initial screening of line staff <em>(Essential Solutions)</em> — Resumes, questionnaires, and applications turn into a candidate short-list for HR.</li>
<li>Digital loop for field staff work <em>(Essential Solutions)</em> — The employee's workday, required actions, and completion confirmations in a mobile loop.</li>
<li>Early signals of turnover and onboarding quality <em>(Advanced Solutions)</em> [prerequisite] — Where an employee drops out of the process is visible before resignation.</li>

const Drawer = ({ card, onClose, onJump }) => {
  useEffect(() => {
    const h = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);

  if (!card) return null;

  const dc = React.useContext(DataCtx);
  const block    = (dc ? dc.BLOCK_BY_ID : BLOCK_BY_ID)[card.blockId];
  const imp      = IMPACT_P[card.impact]  || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const scl      = SCALE_P[card.scale]    || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const dcDrawer   = dc ? dc.DRAWER_CONTENT : DRAWER_CONTENT;
  const dcCards    = dc ? dc.CARDS          : CARDS;
  const dcCardById = dc ? dc.CARD_BY_ID     : CARD_BY_ID;
  const dcStageById= dc ? dc.STAGE_BY_ID    : STAGE_BY_ID;
  const d_ctx    = dcDrawer[card.id];
  const opens    = (card.flowsTo || []).map(id => dcCardById[id]).filter(Boolean);
  const requires = dcCards.filter(c => (c.flowsTo || []).includes(card.id));
  const crossTarget = card.crossRef?.targetId ? (dcCardById[card.crossRef.targetId] || CARD_BY_ID[card.crossRef.targetId]) : null;

  const DField = ({ label, children }) => (
    <div style={{ marginBottom:'30px' }}>
      <div style={{
        fontSize:'11px', color:C.accentText, fontWeight:700,

      <div style={{
        fontSize:'15px', color:'#515257',
        lineHeight:1.82, fontWeight:400, textWrap:'pretty',

  );

  const JumpBtn = ({ c }) => {
    const [hov, setHov] = useState(false);

    return (
      <button onClick={() => onJump(c.id)}
        onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}

/* ── BLOCK CANVAS ── */
const BlockCanvas = ({ block, openProblems, onToggleProblem, onToggleAll, onCardClick, isLast }) => {
  const dc2 = React.useContext(DataCtx);
  const blockProblems = useMemo(
    () => (dc2 ? dc2.PROBLEMS : PROBLEMS).filter(p => p.blockId === block.id).sort((a, b) => (a.sequence||0) - (b.sequence||0)),
    [block.id, dc2]
  );
  const cardsByPS = useMemo(() => {
    const out = {};
    for (const p of blockProblems) out[p.id] = { 1:[], 2:[], 3:[] };
    for (const c of (dc2 ? dc2.CARDS : CARDS)) {
      if (!out[c.problemId]) continue;
      out[c.problemId][c.stage].push(c);
    }
    for (const p of blockProblems)
      for (const s of [1,2,3])
        out[p.id][s].sort((a,b) => (a.sequence||0)-(b.sequence||0));
    return out;
  }, [blockProblems, dc2]);
  const allOpen = blockProblems.length > 0 && blockProblems.every(p => openProblems.has(p.id));

  return (
    <div data-block-code={block.code} style={{
      display:'flex', alignItems:'stretch',
      border:`1px solid ${C.border}`,
      borderTop:'none', background:C.bg,
      marginBottom: isLast ? 0 : '28px',
      borderRadius:'0 0 10px 10px',
    }}>
      <BlockRail block={block} allOpen={allOpen} onToggleAll={() => onToggleAll(blockProblems)} />
      <section style={{ flex:1, minWidth:0 }}>
        {blockProblems.map((p, i) => {
          const isOpen    = openProblems.has(p.id);
          const isLastRow = i === blockProblems.length - 1;
          const sub  = p.subBlockId ? SUBBLOCK_BY_ID[p.subBlockId] : null;
          const prev = i > 0 ? blockProblems[i - 1] : null;
          const showSub = sub && (!prev || prev.subBlockId !== p.subBlockId);
          return (
            <React.Fragment key={p.id}>
              {showSub && <SubblockDivider />}
              <div style={{
                display:'grid', gridTemplateColumns:GRID_COLS,
                borderBottom: isLastRow ? 'none' : `1px solid ${C.border}`,
                background: isOpen ? 'rgba(255,106,0,0.03)' : 'transparent',
                transition:'background .15s ease',
              }}>
                <div style={{ padding:'13px', borderRight:`1px solid ${C.border}`, display:'flex', alignItems:'flex-start' }}>
                  <ProblemRect problem={p} isOpen={isOpen} onToggle={() => onToggleProblem(p.id)} />
                </div>
                {[1,2,3].map((sid, si) => (
                  <StageCell key={sid} cards={cardsByPS[p.id][sid]} isOpen={isOpen} isLastCol={si===2} onCardClick={onCardClick} onToggleRow={() => onToggleProblem(p.id)} />
                ))}
              </div>
            </React.Fragment>
          );
        })}
      </section>
    </div>
  );
};

        <div style={{
          maxWidth:'1120px', margin:'0 auto', width:'100%', height:'100%',
          padding:'0 clamp(20px,4vw,48px)', boxSizing:'border-box',
          display:'flex', alignItems:'center', justifyContent:'space-between', gap:'24px',
        }}>
        <Wordmark lang={lang} />
        <nav style={{ display:'flex', alignItems:'center', gap:'28px' }}>
          {screen === 'profile' && (
            <button onClick={goHome} style={{ background:'none', border:'none', cursor:'pointer', color:C.textSec, fontSize:'13px', padding:'4px 0', display:'flex', alignItems:'center', gap:'4px', letterSpacing:'.02em' }}>{L3(lang,'← Catalog','← Каталог','← แคตตาล็อก')}</button>
          )}
          {[{id:'company',label: L3(lang,'About','О нас','เกี่ยวกับเรา')},{id:'how-we-work',label:L3(lang,'How we work','Как работаем','วิธีการทำงาน')},{id:'team',label:L3(lang,'Team','Команда','ทีมงาน')},{id:'contact',label:L3(lang,'Contact','Контакты','ติดต่อ')}].map(item => {
            const isAct = screen==='profile' && profileSection===item.id;
            return (
            <button key={item.id} onClick={() => goProfile(item.id)}
              style={{
                background: 'none',
                border: 'none',
                borderBottom: isAct ? '2px solid #FF6A00' : '2px solid transparent',
                padding: '4px 0',
                cursor: 'pointer',
                fontSize: '13px',
                fontWeight: isAct ? 600 : 500,
                color: isAct ? C.text : C.textSec,
                letterSpacing: '.02em',
                transition: 'color .15s',
              }}
              onMouseEnter={e => { if(!isAct) e.currentTarget.style.color = C.text; }}
              onMouseLeave={e => { if(!isAct) e.currentTarget.style.color = C.textSec; }}
            >{item.label}</button>
            );
          })}
        </nav>
        <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
          <AdvisorBtn />
          <LangSwitcher />
        </div>
        </div>
      </header>
      {langToast && (
        <div style={{
          position:'fixed', bottom:'28px', left:'50%', transform:'translateX(-50%)',
          background:'#1D1D1F', color:'#F5F5F7',
          padding:'10px 20px', borderRadius:'10px',
          fontSize:'13px', fontWeight:500, zIndex:9999,
          boxShadow:'0 4px 20px rgba(0,0,0,0.18)',
          pointerEvents:'none', whiteSpace:'nowrap',
        }}>
          {langToast} — перевод пока не добавлен
        </div>
      )}

      {screen === 'home' && <HeroScreen onScrollToCatalog={scrollToCatalog} onScrollToBlock={scrollToBlock} lang={lang} />}

      {screen === 'profile' && (
        <KKProfileScreen section={profileSection} onBack={goHome} onNav={goProfile} lang={lang} />
      )}

      <main id="catalog-main" style={{ display: screen === 'profile' ? 'none' : undefined, flex:1, padding:'clamp(20px,3vh,36px) clamp(20px,3vw,40px) 80px' }}>

        <div style={{
          position:'sticky', top:`${HEADER_H}px`, zIndex:30,
          display:'grid', gridTemplateColumns:`${RAIL_W}px ${GRID_COLS}`,
          background:C.surface,
          border:`1px solid ${C.border}`,
          borderBottom:`1px solid ${C.borderMid}`,
          borderRadius:'10px 10px 0 0', overflow:'hidden',
        }}>
          <div style={{ position:'relative', borderRight:`1px solid ${C.border}`, background:C.surfaceHov }}>
            <div style={{ position:'absolute', left:0, top:0, bottom:0, width:'3px', background:'linear-gradient(180deg,#FF9D2E 0%,#FF6A00 52%,#F5481F 100%)' }} />
          </div>
          <TasksHeader />
          {d.STAGES.map((s, idx) => (
            <div key={`${s.id}-${lang}`} style={{ borderRight: idx < d.STAGES.length-1 ? `1px solid ${C.border}` : 'none', minWidth:0 }}>
              <StageHeader stage={s} />
            </div>
          ))}
        </div>

        {d.BLOCKS.map((block, idx) => (
          <BlockCanvas key={`${block.id}-${lang}`} block={block}
            openProblems={openProblems} onToggleProblem={toggleProblem}
            onToggleAll={toggleAllInBlock} onCardClick={openCard}
            isLast={idx === d.BLOCKS.length - 1}
          />
        ))}
      </main>

      {activeCard && <Drawer card={activeCard} onClose={closeCard} onJump={jumpToCard} />}
    </div>
    </DataCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


  <script src="/device-hint.js?v=2" defer></script>
  <script src="/advisor.js?v=11" defer></script>
</body></html>
