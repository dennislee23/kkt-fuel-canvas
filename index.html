<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта AI-трансформации топливного ритейла</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400;1,9..40,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<script src="existing/vendor/react.development.js"></script>
<script src="existing/vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>
<template id="__bundler_thumbnail" data-bg-color="#F5F2EC">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#F5F2EC"/>
    <rect x="0" y="0" width="1200" height="52" fill="#fff"/>
    <rect x="36" y="18" width="140" height="9" rx="4" fill="#1A1410" opacity=".5"/>
    <rect x="36" y="31" width="90" height="6" rx="3" fill="#B8832A" opacity=".8"/>
    <rect x="900" y="20" width="60" height="12" rx="6" fill="#B8832A" opacity=".5"/>
    <rect x="0" y="68" width="1200" height="110" fill="#fff" stroke="#E5E0D8" stroke-width="1"/>
    <rect x="240" y="68" width="1" height="110" fill="rgba(30,24,16,0.08)"/>
    <rect x="530" y="68" width="1" height="110" fill="rgba(30,24,16,0.08)"/>
    <rect x="820" y="68" width="1" height="110" fill="rgba(30,24,16,0.08)"/>
    <rect x="540" y="90" width="80" height="20" rx="4" fill="#2D6A4F" opacity=".7"/>
    <rect x="830" y="90" width="80" height="20" rx="4" fill="#1E4976" opacity=".7"/>
    <rect x="1110" y="90" width="70" height="20" rx="4" fill="#7A2E4A" opacity=".7"/>
    <rect x="0" y="178" width="240" height="622" fill="#2E2016"/>
    <rect x="36" y="210" width="120" height="13" rx="4" fill="#1A1410" opacity=".4"/>
    <rect x="36" y="230" width="80" height="7" rx="3" fill="#B8832A" opacity=".6"/>
    <rect x="255" y="198" width="270" height="120" rx="7" fill="#fff" stroke="rgba(30,24,16,0.09)" stroke-width="1"/>
    <rect x="255" y="198" width="270" height="2" rx="1" fill="#2D6A4F" opacity=".5"/>
    <rect x="545" y="198" width="270" height="120" rx="7" fill="#fff" stroke="rgba(30,24,16,0.09)" stroke-width="1"/>
    <rect x="545" y="198" width="270" height="2" rx="1" fill="#1E4976" opacity=".5"/>
    <rect x="835" y="198" width="270" height="120" rx="7" fill="#fff" stroke="rgba(30,24,16,0.09)" stroke-width="1"/>
    <rect x="835" y="198" width="270" height="2" rx="1" fill="#7A2E4A" opacity=".5"/>
  </svg>
</template>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { min-width: 0; }
html, body {
  min-height: 100%;
  background: #F5F2EC;
  color: #1A1410;
  font-family: 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { min-height: 100vh; }
button { cursor: pointer; font-family: inherit; }
ol, ul { list-style-position: outside; }

::-webkit-scrollbar { width: 5px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(30,24,16,0.14); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(30,24,16,0.24); }

@keyframes fadeUp  { from { transform: translateY(6px); opacity:.94; } to { transform: translateY(0); opacity:1; } }
@keyframes slideIn { from { transform: translateX(18px); } to { transform: translateX(0); } }
.fade-up  { animation: fadeUp  .30s cubic-bezier(.2,.7,.3,1) both; }
.slide-in { animation: slideIn .26s cubic-bezier(.2,.7,.3,1) both; }
@media (prefers-reduced-motion: reduce) { .fade-up, .slide-in { animation: none; } }

.tile { transition: box-shadow .18s ease, transform .16s ease, border-color .16s ease; }
.tile:hover {
  box-shadow: 0 8px 28px rgba(30,24,16,0.12), 0 2px 6px rgba(30,24,16,0.06) !important;
  border-color: rgba(30,24,16,0.18) !important;
  transform: translateY(-2px);
}
.prob-btn { appearance: none; -webkit-appearance: none; }
.prob-btn:focus-visible { outline: 2px solid #B8832A; outline-offset: 2px; }
@media print {
  html, body { min-width: 0 !important; overflow-x: hidden !important; }
  @page { size: A4 landscape; margin: 1cm; }
  #catalog-main { display: none !important; }
  .hero-section { min-height: 0 !important; overflow: visible !important; page-break-inside: avoid; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="kktechnologies-profile-data.js"></script>
<script src="existing/roadmap-data.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const BLOCKS         = window.FUEL_BLOCKS;
const SUBBLOCKS      = window.FUEL_SUBBLOCKS || [];
const PROBLEMS       = window.FUEL_PROBLEMS;
const STAGES         = window.FUEL_STAGES;
const CARDS          = window.FUEL_CARDS;
const DRAWER_CONTENT = window.FUEL_DRAWER_CONTENT || {};

const BLOCK_BY_ID    = Object.fromEntries(BLOCKS.map(b  => [b.id,  b]));
const PROBLEM_BY_ID  = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
const CARD_BY_ID     = Object.fromEntries(CARDS.map(c   => [c.id,  c]));
const STAGE_BY_ID    = Object.fromEntries(STAGES.map(s  => [s.id,  s]));
const SUBBLOCK_BY_ID = Object.fromEntries(SUBBLOCKS.map(s => [s.id, s]));

/* ── Palette ── */
const C = {
  bg:         '#F5F2EC',
  surface:    '#FFFFFF',
  surfaceHov: '#F8F6F2',
  rail:       '#2E2016',
  border:     'rgba(30,24,16,0.09)',
  borderMid:  'rgba(30,24,16,0.14)',
  borderHov:  'rgba(30,24,16,0.22)',
  text:       '#1A1410',
  textSec:    '#5C5045',
  textMuted:  '#9C8E82',
  accent:     '#B8832A',
  accentDim:  'rgba(184,131,42,0.14)',
  accentText: '#9A6818',
};

const HEADER_H    = 60;
const STAGE_BAR_H = 124;
const RAIL_W      = 236;
const TASKS_COL   = '272px';
const GRID_COLS   = `${TASKS_COL} repeat(3, minmax(220px, 1fr))`;
const PROB_H      = 148;

const STAGE_P = {
  1: { accent:'#2D6A4F', dim:'rgba(45,106,79,0.09)',   line:'rgba(45,106,79,0.45)'   },
  2: { accent:'#1E4976', dim:'rgba(30,73,118,0.09)',   line:'rgba(30,73,118,0.45)'   },
  3: { accent:'#7A2E4A', dim:'rgba(122,46,74,0.09)',   line:'rgba(122,46,74,0.45)'   },
};

const IMPACT_P = {
  'Рост выручки':                 { fg:'#1E8A68', bg:'rgba(36,181,138,0.10)' },
  'Сокращение затрат':            { fg:'#A04A00', bg:'rgba(192,90,0,0.10)'   },
  'Скорость и качество решений':  { fg:'#5A58C0', bg:'rgba(90,88,192,0.10)'  },
  'Повышение производительности': { fg:'#7A4EA0', bg:'rgba(122,78,160,0.10)' },
};
const SCALE_P = {
  'Quick Win':      { fg:'#1E8A68', bg:'rgba(36,181,138,0.10)' },
  'Быстрый эффект': { fg:'#1E8A68', bg:'rgba(36,181,138,0.10)' },
  'Scoped Project': { fg:'#3A6DD4', bg:'rgba(58,109,212,0.10)' },
  'Проектный запуск':{ fg:'#3A6DD4', bg:'rgba(58,109,212,0.10)' },
  'Major Program':  { fg:'#7A4EA0', bg:'rgba(122,78,160,0.10)' },
  'Системная программа':{ fg:'#7A4EA0', bg:'rgba(122,78,160,0.10)' },
};
const COST_P = { fg:'#A04A00', bg:'rgba(192,90,0,0.10)' };

/* ── ATOMS ── */
const Pill = ({ label, fg, bg, size='sm' }) => (
  <span style={{
    display:'inline-flex', alignItems:'center',
    padding: size==='sm' ? '2px 6px' : '4px 12px',
    borderRadius:'100px', background:bg, color:fg,
    fontSize: size==='sm' ? '8.5px' : '11.5px',
    fontWeight:600, letterSpacing:'.01em',
    whiteSpace:'nowrap', lineHeight:1.5, flexShrink:0,
  }}>{label}</span>
);

const Wordmark = () => (
  <div style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
    <span style={{ fontSize:'11px', fontWeight:700, letterSpacing:'.20em', textTransform:'uppercase', color:C.text, lineHeight:1 }}>
      Карта AI-трансформации
    </span>
    <span style={{ fontSize:'9px', fontWeight:600, letterSpacing:'.22em', textTransform:'uppercase', color:C.accent, lineHeight:1 }}>
      by KKTechnologies
    </span>
  </div>
);

const splitSpine = (text) => {
  if (!text) return [text];
  const parts = text.split(/(?<=\.)\s+/);
  if (parts.length <= 2) return [text];
  const mid = Math.ceil(parts.length / 2);
  return [parts.slice(0, mid).join(' '), parts.slice(mid).join(' ')].filter(Boolean);
};

/* ── TAG ROW ── */
const TagRow = ({ card }) => {
  const imp = IMPACT_P[card.impact] || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const scl = SCALE_P[card.scale]   || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  return (
    <div style={{ display:'flex', flexWrap:'nowrap', gap:'4px', alignItems:'center', overflow:'hidden' }}>
      <Pill label={card.scale}  fg={scl.fg} bg={scl.bg} />
      <Pill label={card.cost}   fg={COST_P.fg} bg={COST_P.bg} />
      <Pill label={card.impact} fg={imp.fg}  bg={imp.bg} />
    </div>
  );
};

/* ── CARD TILE ── */
const CardTile = ({ card, onClick }) => {
  const sp = STAGE_P[card.stage];
  return (
    <div className="tile" onClick={onClick} data-card-id={card.id}
      style={{
        position:'relative', padding:'16px 17px 15px',
        background:C.surface,
        border:`1px solid ${C.border}`,
        borderTop:`2px solid ${sp.line}`,
        borderRadius:'8px', cursor:'pointer',
        display:'flex', flexDirection:'column', gap:'10px',
        boxShadow:'0 1px 4px rgba(30,24,16,0.06)',
      }}
    >
      <h4 style={{
        fontFamily:'Playfair Display, serif',
        fontSize:'14.5px', fontWeight:500, color:C.text,
        lineHeight:1.30, letterSpacing:'-.008em',
        textWrap:'pretty', paddingRight:'18px',
      }}>{card.title}</h4>

      <p style={{
        fontSize:'11.5px', color:'#7A6E64',
        lineHeight:1.65, fontWeight:400,
        fontStyle:'italic', textWrap:'pretty', flex:1,
      }}>{card.shortDescription}</p>

      <div style={{ marginTop:'auto' }}>
        <div style={{ paddingTop:'9px', borderTop:`1px solid ${C.border}` }}>
          <TagRow card={card} />
        </div>
        {card.lock && (
          <div style={{ display:'flex', gap:'5px', alignItems:'flex-start', marginTop:'8px' }}>
            <span style={{ fontSize:'10px', color:C.textMuted, lineHeight:1.55, flexShrink:0 }}>🔒</span>
            <span style={{ fontSize:'10.5px', color:C.textMuted, lineHeight:1.55, fontWeight:400, textWrap:'pretty' }}>{card.lock}</span>
          </div>
        )}
        {card.crossRef && !card.lock && (
          <div style={{ marginTop:'7px' }}>
            <span style={{ fontSize:'10.5px', color:C.textMuted, fontWeight:400 }}>→ см. дом: {card.crossRef.targetLabel}</span>
          </div>
        )}
      </div>
      <span style={{ position:'absolute', top:'14px', right:'13px', color:`${C.borderMid}`, fontSize:'16px', lineHeight:1 }}>›</span>
    </div>
  );
};

/* ── STAGE HEADER ── */
const StageHeader = ({ stage }) => {
  const sp = STAGE_P[stage.id];
  return (
    <div style={{
      position:'relative', height:'100%',
      padding:'20px 22px 24px',
      background:`linear-gradient(155deg, ${sp.dim} 0%, ${C.surface} 70%)`,
      display:'flex', flexDirection:'column', gap:'6px',
    }}>
      <h3 style={{
        fontFamily:'Playfair Display, serif',
        fontSize:'17px', fontWeight:500, color:C.text,
        lineHeight:1.18, letterSpacing:'-.005em',
      }}>{stage.name}</h3>
      <p style={{
        fontSize:'11px', color:C.textSec,
        lineHeight:1.55, fontWeight:400, textWrap:'pretty',
        overflowWrap:'break-word', wordBreak:'break-word',
      }}>{stage.description}</p>
    </div>
  );
};

/* ── TASKS HEADER ── */
const TasksHeader = () => (
  <div style={{
    padding:'20px 20px 22px',
    background:C.bg, height:'100%',
    display:'flex', flexDirection:'column', justifyContent:'flex-start', gap:'5px',
    borderRight:`1px solid ${C.border}`,
  }}>
    <h3 style={{
      fontFamily:'Playfair Display, serif',
      fontSize:'15px', fontWeight:500, color:C.text,
      lineHeight:1.28, letterSpacing:'-.005em', textWrap:'pretty',
    }}>Типовые задачи,<br/>с которыми мы работаем</h3>
    <p style={{ fontSize:'10.5px', color:C.textMuted, lineHeight:1.5, fontWeight:400 }}>
      Нажмите задачу → раскрыть решения
    </p>
  </div>
);

/* ── PROBLEM RECT ── */
const ProblemRect = ({ problem, isOpen, onToggle }) => {
  const [hov, setHov] = useState(false);
  const active = isOpen || hov;
  return (
    <button onClick={onToggle} aria-expanded={isOpen}
      className="prob-btn"
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        height:`${PROB_H}px`, width:'100%', textAlign:'left', cursor:'pointer',
        background: isOpen ? C.surfaceHov : hov ? 'rgba(30,24,16,0.02)' : C.surface,
        border:`1px solid ${active ? C.borderHov : C.border}`,
        borderLeft:`3px solid ${active ? C.accent : C.border}`,
        borderRadius:'8px',
        padding:'15px 38px 15px 15px',
        display:'flex', flexDirection:'column', gap:'6px',
        position:'relative', overflow:'hidden',
        transition:'background .15s ease, border-color .15s ease',
        boxShadow: isOpen ? 'none' : '0 1px 3px rgba(30,24,16,0.05)',
      }}
    >
      <span style={{
        fontFamily:'Playfair Display, serif',
        fontSize:'14.5px', fontWeight:600, color:C.text,
        lineHeight:1.26, letterSpacing:'-.005em', textWrap:'pretty',
      }}>{problem.title}</span>
      <span style={{
        fontSize:'10.5px', color:'#7A6E64',
        lineHeight:1.55, fontWeight:400, fontStyle:'italic', textWrap:'pretty',
      }}>{problem.painLine}</span>
      <span style={{
        position:'absolute', top:'12px', right:'12px',
        width:'20px', height:'20px', borderRadius:'50%',
        border:`1px solid ${isOpen ? C.accent : C.borderMid}`,
        background: isOpen ? C.accent : 'transparent',
        display:'flex', alignItems:'center', justifyContent:'center',
        color: isOpen ? '#fff' : C.textMuted,
        fontSize:'10px', lineHeight:1,
        transform: isOpen ? 'rotate(180deg)' : 'none',
        transition:'transform .22s ease, background .15s ease, color .15s ease, border-color .15s ease',
      }}>⌄</span>
    </button>
  );
};

/* ── STAGE CELL ── */
const StageCell = ({ cards, isOpen, isLastCol, onCardClick }) => (
  <div style={{
    padding: isOpen ? '14px 12px' : '0',
    borderRight: isLastCol ? 'none' : `1px solid ${C.border}`,
    display:'flex', flexDirection:'column', gap:'10px',
    minWidth:0,
  }}>
    {isOpen && (
      cards.length > 0
        ? cards.map(c => <CardTile key={c.id} card={c} onClick={() => onCardClick(c)} />)
        : <div style={{ minHeight:'60px', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <span style={{ fontSize:'20px', color:'rgba(30,24,16,0.08)', lineHeight:1 }}>·</span>
          </div>
    )}
  </div>
);

const SubblockDivider = () => (
  <div style={{ height:'1px', background:'rgba(30,24,16,0.07)', gridColumn:'1 / -1' }} />
);

/* ── BLOCK RAIL ── */
const BlockRail = ({ block, allOpen, onToggleAll }) => {
  const paras = splitSpine(block.spine);
  return (
    <aside style={{
      width:`${RAIL_W}px`, flexShrink:0,
      borderRight:'2px solid rgba(245,240,232,0.15)',
      background:C.rail,
    }}>
      <div style={{
        position:'sticky', top:`${HEADER_H + STAGE_BAR_H}px`,
        padding:'clamp(32px,5vh,56px) 22px 28px 22px',
      }}>
        <h2 style={{
          fontFamily:'Playfair Display, serif',
          fontSize:'22px', fontWeight:600, color:'#F5F0E8',
          lineHeight:1.13, letterSpacing:'-.01em', marginBottom:'4px',
        }}>{block.title}</h2>

        <span style={{
          display:'block', fontSize:'12px', color:'rgba(245,240,232,0.62)',
          fontStyle:'italic', fontWeight:500, marginBottom:'16px',
        }}>{block.tagline}</span>

        <div style={{ width:'28px', height:'1.5px', background:'rgba(245,240,232,0.35)', marginBottom:'18px' }} />

        {paras.map((p, i) => (
          <p key={i} style={{
            fontSize:'12px', color:'rgba(245,240,232,0.58)', lineHeight:1.75,
            fontWeight:400, textWrap:'pretty',
            marginBottom: i < paras.length - 1 ? '14px' : '24px',
          }}>{p}</p>
        ))}

        <button onClick={onToggleAll}
          style={{
            display:'inline-flex', alignItems:'center', gap:'7px',
            background: allOpen ? 'rgba(245,240,232,0.10)' : 'rgba(245,240,232,0.15)',
            color:'rgba(245,240,232,0.85)',
            border: allOpen ? '1px solid rgba(245,240,232,0.20)' : '1px solid rgba(245,240,232,0.30)',
            padding:'8px 15px', borderRadius:'7px',
            fontSize:'11px', fontWeight:600, letterSpacing:'.03em',
            cursor:'pointer', whiteSpace:'nowrap',
            transition:'background .15s, border-color .15s',
          }}
        >
          <span style={{ color:'rgba(245,240,232,0.80)' }}>{allOpen ? 'Свернуть всё' : 'Показать всё'}</span>
          <span style={{ fontSize:'8px', opacity:.6, color:'rgba(245,240,232,0.80)' }}>{allOpen ? '▲' : '▼'}</span>
        </button>
      </div>
    </aside>
  );
};

/* ── DRAWER ── */
const Drawer = ({ card, onClose, onJump }) => {
  useEffect(() => {
    const h = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);

  if (!card) return null;

  const block    = BLOCK_BY_ID[card.blockId];
  const imp      = IMPACT_P[card.impact]  || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const scl      = SCALE_P[card.scale]    || { fg:C.textSec, bg:'rgba(30,24,16,0.07)' };
  const d        = DRAWER_CONTENT[card.id];
  const opens    = (card.flowsTo || []).map(id => CARD_BY_ID[id]).filter(Boolean);
  const requires = CARDS.filter(c => (c.flowsTo || []).includes(card.id));
  const crossTarget = card.crossRef?.targetId ? CARD_BY_ID[card.crossRef.targetId] : null;

  const DField = ({ label, children }) => (
    <div style={{ marginBottom:'30px' }}>
      <div style={{
        fontSize:'11px', color:C.accentText, fontWeight:700,
        letterSpacing:'.14em', textTransform:'uppercase', marginBottom:'12px',
      }}>{label}</div>
      <div style={{
        fontSize:'15px', color:'#3A3028',
        lineHeight:1.82, fontWeight:400, textWrap:'pretty',
      }}>{children}</div>
    </div>
  );

  const JumpBtn = ({ c }) => {
    const [hov, setHov] = useState(false);
    const csp    = STAGE_P[c.stage];
    const cStage = STAGE_BY_ID[c.stage];
    return (
      <button onClick={() => onJump(c.id)}
        onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
        style={{
          display:'flex', alignItems:'center', gap:'10px', textAlign:'left',
          padding:'10px 13px',
          background: hov ? C.surfaceHov : C.surface,
          border:`1px solid ${hov ? C.borderHov : C.border}`,
          borderLeft:`3px solid ${csp.accent}`,
          borderRadius:'7px', cursor:'pointer',
          boxShadow:'0 1px 3px rgba(30,24,16,0.05)',
          transition:'background .15s ease, border-color .15s ease',
        }}
      >
        <Pill label={cStage.name} fg={csp.accent} bg={csp.dim} size="sm" />
        <span style={{ flex:1, fontSize:'13px', color:C.text, fontWeight:500, lineHeight:1.35, textWrap:'pretty' }}>
          {c.title}
        </span>
        <span style={{ color:C.textMuted, fontSize:'15px', lineHeight:1, flexShrink:0 }}>›</span>
      </button>
    );
  };

  return (
    <div style={{ position:'fixed', inset:0, zIndex:50, display:'flex', justifyContent:'flex-end' }}>
      <div style={{ position:'absolute', inset:0, background:'rgba(30,24,16,0.32)' }} onClick={onClose} />
      <div className="slide-in" style={{
        position:'relative', width:'min(620px, 100vw)', height:'100%',
        background:C.surface,
        borderLeft:`1px solid ${C.border}`,
        overflowY:'auto',
        padding:'28px clamp(28px,5vw,52px) 80px',
        display:'flex', flexDirection:'column',
        boxShadow:'-20px 0 60px rgba(30,24,16,0.12)',
      }}>

        <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:'24px' }}>
          <button onClick={onClose} aria-label="Закрыть"
            style={{
              background:'none', border:`1px solid ${C.borderMid}`,
              width:'30px', height:'30px', borderRadius:'50%',
              cursor:'pointer', color:C.textSec,
              fontSize:'16px', display:'flex', alignItems:'center', justifyContent:'center',
              lineHeight:1, transition:'border-color .15s, background .15s',
            }}

/* ── BLOCK CANVAS ── */
const BlockCanvas = ({ block, openProblems, onToggleProblem, onToggleAll, onCardClick, isLast }) => {
  const blockProblems = useMemo(
    () => PROBLEMS.filter(p => p.blockId === block.id).sort((a, b) => (a.sequence||0) - (b.sequence||0)),
    [block.id]
  );
  const cardsByPS = useMemo(() => {
    const out = {};
    for (const p of blockProblems) out[p.id] = { 1:[], 2:[], 3:[] };
    for (const c of CARDS) {
      if (!out[c.problemId]) continue;
      out[c.problemId][c.stage].push(c);
    }
    for (const p of blockProblems)
      for (const s of [1,2,3])
        out[p.id][s].sort((a,b) => (a.sequence||0)-(b.sequence||0));
    return out;
  }, [blockProblems]);
  const allOpen = blockProblems.length > 0 && blockProblems.every(p => openProblems.has(p.id));

  return (
    <div data-block-code={block.code} style={{
      display:'flex', alignItems:'stretch',
      border:`1px solid ${C.border}`,
      borderTop:'none', background:C.bg,
      marginBottom: isLast ? 0 : '28px',
      borderRadius:'0 0 10px 10px',
      overflow:'hidden',
      boxShadow:'0 2px 10px rgba(30,24,16,0.06)',
    }}>
      <BlockRail block={block} allOpen={allOpen} onToggleAll={() => onToggleAll(blockProblems)} />
      <section style={{ flex:1, minWidth:0 }}>
        {blockProblems.map((p, i) => {
          const isOpen    = openProblems.has(p.id);
          const isLastRow = i === blockProblems.length - 1;
          const sub  = p.subBlockId ? SUBBLOCK_BY_ID[p.subBlockId] : null;
          const prev = i > 0 ? blockProblems[i - 1] : null;
          const showSub = sub && (!prev || prev.subBlockId !== p.subBlockId);
          return (
            <React.Fragment key={p.id}>
              {showSub && <SubblockDivider />}
              <div style={{
                display:'grid', gridTemplateColumns:GRID_COLS,
                borderBottom: isLastRow ? 'none' : `1px solid ${C.border}`,
                background: isOpen ? 'rgba(30,24,16,0.015)' : 'transparent',
                transition:'background .15s ease',
              }}>
                <div style={{ padding:'13px', borderRight:`1px solid ${C.border}`, display:'flex' }}>
                  <ProblemRect problem={p} isOpen={isOpen} onToggle={() => onToggleProblem(p.id)} />
                </div>
                {[1,2,3].map((sid, si) => (
                  <StageCell key={sid} cards={cardsByPS[p.id][sid]} isOpen={isOpen} isLastCol={si===2} onCardClick={onCardClick} />
                ))}
              </div>
            </React.Fragment>
          );
        })}
      </section>
    </div>
  );
};

        <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr)', alignItems: 'end', padding: '14px 20px 18px' }}>
          {VALUE_CHAIN.map((node, i) => (
            <React.Fragment key={node.id}>
              <ChainNode node={node} />
              {i < VALUE_CHAIN.length - 1 && <ChainArrow />}
            </React.Fragment>
          ))}
        </div>
        {/* Cross-cutting layers — compact pills */}
        <div style={{ borderTop: `1px solid rgba(30,24,16,0.07)`, padding: '8px 14px 10px' }}>
          <div style={{ fontSize: '8.5px', color: C.textMuted, fontWeight: 700, letterSpacing: '.16em', textTransform: 'uppercase', marginBottom: '7px', opacity: 0.75 }}>+ сквозные контуры</div>
          <div style={{ display: 'flex', alignItems: 'stretch', gap: '0' }}>
            <MgmtPill layer={MGMT_LAYERS[0]} />
            <div style={{ width: '1px', background: 'rgba(30,24,16,0.10)', margin: '4px 0', flexShrink: 0 }} />
            <MgmtPill layer={MGMT_LAYERS[1]} />
            <div style={{ width: '1px', background: 'rgba(30,24,16,0.10)', margin: '4px 0', flexShrink: 0 }} />
            <MgmtPill layer={MGMT_LAYERS[2]} />
          </div>
        </div>
      </div>

      {/* 2×2 value props */}
      <div style={{ flex: '1 1 auto', minHeight: 0 }}>
        <div style={{ fontSize: '9px', color: C.textMuted, fontWeight: 700, letterSpacing: '.18em', textTransform: 'uppercase', marginBottom: '8px', opacity: 0.6 }}>Почему это работает для бизнеса</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0,1fr))', gap: '8px' }}>
          {VALUE_PROPS.map((vp, i) => (
            <div key={i} style={{
              background: 'transparent',
              border: 'none',
              borderLeft: `2px solid rgba(184,131,42,0.28)`,
              padding: '2px 0 4px 12px',
              display: 'flex', flexDirection: 'column', gap: '3px',
            }}>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: '7px' }}>
                <span style={{ fontSize: '9px', fontWeight: 700, color: C.accentText, letterSpacing: '.08em', flexShrink: 0 }}>{'0' + (i + 1)}</span>
                <div style={{
                  fontFamily: 'Playfair Display, serif',
                  fontSize: '14px', fontWeight: 500,
                  color: C.text, lineHeight: 1.24,
                  letterSpacing: '-.008em', textWrap: 'pretty',
                }}>{vp.title}</div>
              </div>
              <div style={{
                fontSize: '11.5px', color: C.textSec,
                lineHeight: 1.52, fontWeight: 400,
                fontStyle: 'italic', textWrap: 'pretty',
              }}>{vp.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* CTA */}
      <div style={{ display: 'flex', alignItems: 'center', gap: '20px', flexShrink: 0, paddingBottom: '4px' }}>
        <button
          onClick={onScrollToCatalog}
          style={{
            display: 'inline-flex', alignItems: 'center', gap: '8px',
            background: C.accent, color: '#fff', border: 'none',
            padding: '11px 24px', borderRadius: '8px',
            fontSize: '13px', fontWeight: 600, letterSpacing: '.02em',
            cursor: 'pointer',
            boxShadow: '0 2px 10px rgba(184,131,42,0.28)',
            transition: 'background .15s, box-shadow .15s',
          }}
          onMouseEnter={e => { e.currentTarget.style.background='#A0711F'; e.currentTarget.style.boxShadow='0 4px 16px rgba(184,131,42,0.34)'; }}
          onMouseLeave={e => { e.currentTarget.style.background=C.accent; e.currentTarget.style.boxShadow='0 2px 10px rgba(184,131,42,0.28)'; }}
        >
          Смотреть каталог решений
          <span style={{ fontSize: '15px', lineHeight: 1 }}>↓</span>
        </button>
        <span style={{ fontSize: '11.5px', color: C.textMuted, fontStyle: 'italic' }}>
          {CARDS.length} инициатив · {BLOCKS.length} направлений
        </span>
      </div>

    </section>
  );
};

/* ── PROFILE HELPERS ── */
const SectionLabelP = ({ children }) => (
  <div style={{ fontSize:'10px', color:C.accentText, fontWeight:700, letterSpacing:'.16em', textTransform:'uppercase', marginBottom:'6px' }}>{children}</div>
);
const ProfileChip = ({ label }) => (
  <span style={{ display:'inline-flex', alignItems:'center', padding:'3px 9px', border:`1px solid ${C.border}`, borderRadius:'20px', color:C.textMuted, fontSize:'11px', lineHeight:1.2 }}>{label}</span>
);

/* ── KKTECH PROFILE SCREEN ── */
const KKProfileScreen = ({ section, onBack, onNav }) => {
  const P = window.KKTECH_PROFILE || {};
  const company = P.company || {};
  const how = P.howWeWork || {};
  const team = P.team || {};
  const contact = P.contact || {};
  const active = section || 'company';
  const [activeCase, setActiveCase] = useState(null);

  const card = (children, style={}) => (
    <div style={{ padding:'18px 20px', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'8px', ...style }}>{children}</div>
  );

  const renderCompany = () => (
    <div>
      <div style={{ maxWidth:'800px', marginBottom:'28px' }}>
        <p style={{ fontSize:'11px', color:C.accentText, textTransform:'uppercase', letterSpacing:'.1em', fontWeight:700, marginBottom:'10px' }}>{company.eyebrow}</p>
        <h2 style={{ fontFamily:'Playfair Display, serif', fontSize:'clamp(28px,3.5vw,44px)', fontWeight:400, color:C.text, marginBottom:'14px', lineHeight:1.14 }}>{company.title}</h2>
        <p style={{ fontSize:'16px', color:C.text, lineHeight:1.68, fontWeight:500, marginBottom:'24px', textWrap:'pretty' }}>{company.lead}</p>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:'14px 28px', marginBottom:'22px' }}>
        {(company.body || []).map((t, i) => (
          <div key={i} style={{
            borderLeft: '2px solid rgba(184,131,42,0.28)',
            padding: '2px 0 4px 12px',
            display: 'flex', flexDirection: 'column', gap: '3px',
          }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:'7px' }}>
              <span style={{ fontSize:'9px', fontWeight:700, color:C.accentText, letterSpacing:'.08em', flexShrink:0 }}>{'0'+(i+1)}</span>
              <span style={{ fontSize:'13.5px', fontWeight:400, color:C.textSec, lineHeight:1.6, textWrap:'pretty' }}>{t}</span>
            </div>
          </div>
        ))}
      </div>
      {!!(company.trackRecord?.items?.length) && (
        <section style={{ marginTop:'28px' }}>
          <SectionLabelP>{company.trackRecord.title}</SectionLabelP>
          <p style={{ fontSize:'14px', color:C.textSec, lineHeight:1.65, fontWeight:300, marginBottom:'14px', marginTop:'6px' }}>{company.trackRecord.lead}</p>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))', gap:'12px' }}>
            {(company.trackRecord.items || []).map(item => (
              <button key={item.id} onClick={() => setActiveCase(item)} style={{ textAlign:'left', padding:'18px', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'8px', cursor:'pointer', display:'flex', flexDirection:'column', gap:'10px' }}>
                <div style={{ fontSize:'11px', color:C.accentText, fontWeight:700, letterSpacing:'.06em', textTransform:'uppercase' }}>{item.label}</div>
                {item.meta && <div style={{ fontSize:'11px', color:C.textMuted }}>{item.meta}</div>}
                <h3 style={{ fontSize:'16px', color:C.text, fontWeight:600, lineHeight:1.28, margin:0 }}>{item.focus}</h3>
                <p style={{ fontSize:'13px', color:C.textSec, lineHeight:1.55, fontWeight:300, display:'-webkit-box', WebkitLineClamp:4, WebkitBoxOrient:'vertical', overflow:'hidden' }}>{item.whatWeDid}</p>
                <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:'9px', marginTop:'auto' }}>
                  <SectionLabelP>Бизнес-результат</SectionLabelP>
                  <p style={{ fontSize:'12px', color:C.textSec, lineHeight:1.5 }}>{item.result}</p>
                </div>
                <div style={{ fontSize:'12px', color:C.accentText, fontWeight:500 }}>Подробнее →</div>
              </button>
            ))}
          </div>
        </section>
      )}
    </div>
  );

  const renderHow = () => (
    <div>
      <div style={{ maxWidth:'820px', marginBottom:'28px' }}>
        <p style={{ fontSize:'11px', color:C.textMuted, textTransform:'uppercase', letterSpacing:'.1em', fontWeight:500, marginBottom:'10px' }}>{how.title}</p>
        <h2 style={{ fontFamily:'Playfair Display, serif', fontSize:'clamp(28px,3.5vw,44px)', fontWeight:400, color:C.text, marginBottom:'14px', lineHeight:1.14 }}>{how.subtitle}</h2>
        <p style={{ fontSize:'16px', color:C.textSec, lineHeight:1.72, fontWeight:300 }}>{how.lead}</p>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(230px,1fr))', gap:'12px', alignItems:'start' }}>
        {(how.steps || []).map((step, i) => (
          <div key={step.id} style={{ padding:'18px', background:C.surface, border:`1px solid ${C.border}`, borderTop:`3px solid ${C.accent}`, borderRadius:'8px', display:'flex', flexDirection:'column', gap:'10px' }}>
            <div style={{ fontSize:'11px', color:C.accentText, fontWeight:700, letterSpacing:'.09em', textTransform:'uppercase' }}>{i+1}. {step.title}</div>
            <p style={{ fontSize:'13px', color:C.textSec, lineHeight:1.62, fontWeight:300 }}>{step.summary}</p>
            <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:'11px', marginTop:'8px' }}>
              <SectionLabelP>На выходе</SectionLabelP>
              <ul style={{ margin:'6px 0 0 0', padding:'0 0 0 16px', display:'grid', gap:'5px' }}>
                {(step.outputs || []).map(o => <li key={o} style={{ fontSize:'12px', color:C.textSec, lineHeight:1.5 }}>{o}</li>)}
              </ul>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const renderTeam = () => (
    <div>
      <div style={{ maxWidth:'820px', marginBottom:'28px' }}>
        <p style={{ fontSize:'11px', color:C.textMuted, textTransform:'uppercase', letterSpacing:'.1em', fontWeight:500, marginBottom:'10px' }}>{team.title}</p>
        <h2 style={{ fontFamily:'Playfair Display, serif', fontSize:'clamp(28px,3.5vw,44px)', fontWeight:400, color:C.text, marginBottom:'14px', lineHeight:1.14 }}>Отраслевая экспертиза и техническая поставка — в одной команде</h2>
        <p style={{ fontSize:'16px', color:C.textSec, lineHeight:1.72, fontWeight:300, marginBottom:'8px' }}>{team.lead}</p>
        {team.sublead && <p style={{ fontSize:'14px', color:C.textMuted, lineHeight:1.65, fontWeight:300 }}>{team.sublead}</p>}
      </div>
      <div style={{ display:'grid', gap:'24px' }}>
        {(team.groups || []).map(group => (
          <section key={group.id}>
            <SectionLabelP>{group.title}</SectionLabelP>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))', gap:'10px', marginTop:'10px' }}>
              {(group.members || []).map(member => (
                <div key={member.name} style={{ padding:'16px', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'8px', display:'grid', gap:'10px' }}>
                  <div style={{ display:'flex', gap:'12px', alignItems:'flex-start' }}>
                    <div style={{ width:'40px', height:'40px', borderRadius:'50%', background:C.bg, border:`1px solid ${C.border}`, color:C.accentText, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'12px', fontWeight:700, flexShrink:0 }}>{member.initials}</div>
                    <div>
                      <h3 style={{ fontSize:'15px', color:C.text, fontWeight:600, marginBottom:'4px', lineHeight:1.25 }}>{member.name}</h3>
                      <p style={{ fontSize:'12px', color:C.textSec, lineHeight:1.5, fontWeight:300 }}>{member.line}</p>
                    </div>
                  </div>
                  <div style={{ display:'flex', gap:'5px', flexWrap:'wrap' }}>
                    {(member.chips || []).map(chip => <ProfileChip key={chip} label={chip} />)}
                  </div>
                </div>
              ))}
            </div>
          </section>
        ))}
      </div>
      {team.benchNote && <div style={{ marginTop:'20px', padding:'15px 18px', background:C.bg, border:`1px solid ${C.border}`, borderRadius:'8px' }}><p style={{ fontSize:'13px', color:C.textSec, lineHeight:1.6, fontWeight:300 }}>{team.benchNote}</p></div>}
    </div>
  );

  const renderContact = () => (
    <div style={{ maxWidth:'900px' }}>
      <p style={{ fontSize:'11px', color:C.textMuted, textTransform:'uppercase', letterSpacing:'.1em', fontWeight:500, marginBottom:'10px' }}>{contact.title}</p>
      <h2 style={{ fontFamily:'Playfair Display, serif', fontSize:'clamp(22px,2.4vw,38px)', fontWeight:400, color:C.text, marginBottom:'28px', lineHeight:1.22, textWrap:'pretty' }}>{contact.lead}</h2>
      <div style={{ padding:'22px', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'8px', display:'grid', gap:'16px' }}>
        <div><SectionLabelP>Email</SectionLabelP><a href={`mailto:${contact.email}`} style={{ color:C.text, fontSize:'16px', textDecoration:'none' }}>{contact.email}</a></div>
        <div><SectionLabelP>Сайт</SectionLabelP><a href={`https://${contact.website}`} style={{ color:C.text, fontSize:'16px', textDecoration:'none' }}>{contact.website}</a></div>
        <div><SectionLabelP>Компания</SectionLabelP><p style={{ color:C.textSec, fontSize:'14px', lineHeight:1.6, margin:0 }}>{contact.company}<br/>{contact.location}</p></div>
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, padding:'clamp(28px,4vh,52px) clamp(20px,4vw,72px) 80px', maxWidth:'1200px', margin:'0 auto', width:'100%', boxSizing:'border-box' }}>
      {active === 'company'      && renderCompany()}
      {active === 'how-we-work'  && renderHow()}
      {active === 'team'         && renderTeam()}
      {active === 'contact'      && renderContact()}

      {activeCase && (
        <div style={{ position:'fixed', inset:0, zIndex:60 }}>
          <div style={{ position:'absolute', inset:0, background:'rgba(20,16,10,0.45)' }} onClick={() => setActiveCase(null)} />
          <div style={{ position:'absolute', top:'50%', left:'50%', transform:'translate(-50%,-50%)', width:'min(860px,calc(100vw - 32px))', maxHeight:'calc(100vh - 48px)', overflow:'auto', background:C.surface, border:`1px solid ${C.border}`, borderRadius:'10px', boxShadow:'0 18px 48px rgba(0,0,0,.16)' }}>
            <div style={{ padding:'18px 20px', borderBottom:`1px solid ${C.border}`, display:'flex', justifyContent:'space-between', gap:'12px', alignItems:'flex-start' }}>
              <div>
                <div style={{ fontSize:'11px', color:C.accentText, fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', marginBottom:'6px' }}>{activeCase.label}</div>
                {activeCase.meta && <div style={{ fontSize:'11px', color:C.textMuted, marginBottom:'8px' }}>{activeCase.meta}</div>}
                <h3 style={{ fontSize:'22px', color:C.text, fontWeight:600, lineHeight:1.2, margin:0 }}>{activeCase.focus}</h3>
              </div>
              <button onClick={() => setActiveCase(null)} style={{ background:'none', border:`1px solid ${C.border}`, width:'30px', height:'30px', borderRadius:'50%', cursor:'pointer', color:C.textSec, flexShrink:0 }}>×</button>
            </div>
            <div style={{ padding:'22px 20px', display:'grid', gap:'16px' }}>
              {activeCase.detail?.context && <div><SectionLabelP>Бизнес-контекст</SectionLabelP><p style={{ fontSize:'14px', color:C.textSec, lineHeight:1.65, fontWeight:300, marginTop:'6px' }}>{activeCase.detail.context}</p></div>}
              {activeCase.detail?.role && <div><SectionLabelP>Наша роль</SectionLabelP><p style={{ fontSize:'14px', color:C.textSec, lineHeight:1.65, fontWeight:300, marginTop:'6px' }}>{activeCase.detail.role}</p></div>}
              {!!(activeCase.detail?.scope?.length) && <div><SectionLabelP>Что делали</SectionLabelP><ul style={{ margin:'6px 0 0 0', padding:'0 0 0 18px', display:'grid', gap:'6px' }}>{activeCase.detail.scope.map(p => <li key={p} style={{ fontSize:'13px', color:C.textSec, lineHeight:1.55 }}>{p}</li>)}</ul></div>}
              {!!(activeCase.detail?.outcome?.length) && <div><SectionLabelP>Бизнес-результат</SectionLabelP><ul style={{ margin:'6px 0 0 0', padding:'0 0 0 18px', display:'grid', gap:'6px' }}>{activeCase.detail.outcome.map(p => <li key={p} style={{ fontSize:'13px', color:C.textSec, lineHeight:1.55 }}>{p}</li>)}</ul></div>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── APP ── */
const App = () => {
  const [screen, setScreen] = useState('home');
  const [profileSection, setProfileSection] = useState('company');
  const [activeCardId, setActiveCardId] = useState(null);
  const [openProblems, setOpenProblems] = useState(() => new Set());

  const goProfile = useCallback((sec='company') => { setProfileSection(sec); setScreen('profile'); window.scrollTo({ top:0, behavior:'smooth' }); }, []);
  const goHome = useCallback(() => { setScreen('home'); window.scrollTo({ top:0, behavior:'smooth' }); }, []);

  const toggleProblem    = useCallback(id => setOpenProblems(prev => { const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; }), []);
  const toggleAllInBlock = useCallback(bps => setOpenProblems(prev => { const n=new Set(prev); const all=bps.length>0&&bps.every(p=>n.has(p.id)); all?bps.forEach(p=>n.delete(p.id)):bps.forEach(p=>n.add(p.id)); return n; }), []);
  const openCard   = useCallback(card => setActiveCardId(card.id), []);
  const closeCard  = useCallback(() => setActiveCardId(null), []);
  const jumpToCard = useCallback(id => setActiveCardId(id), []);
  const activeCard = activeCardId ? CARD_BY_ID[activeCardId] : null;

  const scrollToBlock = useCallback((code) => {
    const el = document.querySelector(`[data-block-code="${code}"]`);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - HEADER_H - 8;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }, []);

  const scrollToCatalog = useCallback(() => {
    const el = document.getElementById('catalog-main');
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - HEADER_H - 8;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }, []);

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:C.bg }}>

      <header style={{
        padding:'0 clamp(20px,3vw,44px)', height:`${HEADER_H}px`,
        display:'flex', alignItems:'center', justifyContent:'space-between',
        background:C.surface, borderBottom:`1px solid ${C.border}`,
        boxShadow:'0 1px 10px rgba(30,24,16,0.06)',
        flexShrink:0, position:'sticky', top:0, zIndex:40,
      }}>
        <Wordmark />
        <nav style={{ display:'flex', alignItems:'center', gap:'4px' }}>
          {screen === 'profile' && (
            <button onClick={goHome} style={{ background:'none', border:'none', cursor:'pointer', color:C.textSec, fontSize:'12px', padding:'6px 10px', display:'flex', alignItems:'center', gap:'4px', borderRadius:'6px' }}>← Каталог</button>
          )}
          {[{id:'company',label:'О нас'},{id:'how-we-work',label:'Как работаем'},{id:'team',label:'Команда'},{id:'contact',label:'Контакты'}].map(item => (
            <button key={item.id} onClick={() => goProfile(item.id)}
              style={{
                background: screen==='profile' && profileSection===item.id ? C.bg : 'none',
                border: 'none',
                borderRadius: '6px',
                padding: '6px 12px',
                cursor: 'pointer',
                fontSize: '12.5px',
                fontWeight: screen==='profile' && profileSection===item.id ? 600 : 400,
                color: screen==='profile' && profileSection===item.id ? C.text : C.textSec,
                transition: 'background .14s, color .14s',
              }}
            >{item.label}</button>
          ))}
        </nav>
      </header>

      {screen === 'home' && <HeroScreen onScrollToCatalog={scrollToCatalog} onScrollToBlock={scrollToBlock} />}

      {screen === 'profile' && (
        <KKProfileScreen section={profileSection} onBack={goHome} onNav={goProfile} />
      )}

      <main id="catalog-main" style={{ display: screen === 'profile' ? 'none' : undefined, flex:1, padding:'clamp(20px,3vh,36px) clamp(20px,3vw,40px) 80px' }}>

        <div style={{
          position:'sticky', top:`${HEADER_H}px`, zIndex:30,
          display:'grid', gridTemplateColumns:`${RAIL_W}px ${GRID_COLS}`,
          background:C.surface,
          border:`1px solid ${C.border}`,
          borderBottom:`1px solid ${C.borderMid}`,
          borderRadius:'10px 10px 0 0', overflow:'hidden',
          boxShadow:'0 2px 10px rgba(30,24,16,0.07)',
        }}>
          <div style={{ borderRight:'2px solid rgba(245,240,232,0.15)', background:C.rail }} />
          <TasksHeader />
          {STAGES.map((s, idx) => (
            <div key={s.id} style={{ borderRight: idx < STAGES.length-1 ? `1px solid ${C.border}` : 'none', minWidth:0 }}>
              <StageHeader stage={s} />
            </div>
          ))}
        </div>

        {BLOCKS.map((block, idx) => (
          <BlockCanvas key={block.id} block={block}
            openProblems={openProblems} onToggleProblem={toggleProblem}
            onToggleAll={toggleAllInBlock} onCardClick={openCard}
            isLast={idx === BLOCKS.length - 1}
          />
        ))}
      </main>

      {activeCard && <Drawer card={activeCard} onClose={closeCard} onJump={jumpToCard} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
  <script src="/advisor.js" defer></script>
</body>
</html>
